<script>
/*!
 * charts-theme.js — single source of truth for all visual tokens
 *
 * Every chart engine (line, column/bar, donut/pie, scatter/bubble)
 * reads from Charts.theme at render time. Edit a color in the palette
 * below and every property that references it updates in one shot.
 *
 * Example (dark theme):
 *   Charts.theme.bg = '#1a1a2e';
 *   Charts.theme.titleColor = '#e0e0e0';
 *   Charts.theme.colors = ['#e94560','#0f3460','#533483','#16213e'];
 *   Charts.line('chart', { ... });
 */
(function () {
  window.Charts = window.Charts || {};

  // ── Palette ─────────────────────────────────────────────────────────
  // Neutral scale runs light (n0) → dark (n9). Series scale is the
  // ordered set used for multi-series charts (s1 = primary … s7).
  // Names are role/scale based, not color based — safe to reskin.
  const c = {
    n0: '#f4f4f0',   // page/canvas surface (lightest)
    n0a: '#eae8e4',   // tile/panel surface — one soft step off n0
    n1: '#dcdbd7',   // hairlines, gridlines
    n3: '#8f8d87',   // de-emphasised fills — 3.0:1 on n0, the WCAG 1.4.11
    // floor for graphical objects. Lighter than this and
    // the context bars stop being readable as data.
    n2: '#a8a6a0',   // second de-emphasis step, for a muted ramp
    n2a: '#c2c0ba',   // third step (use only where a ramp needs three)
    n4: '#666666',   // secondary text
    n5: '#555555',   // tertiary text, connectors
    n6: '#444444',   // subtitle text
    n7: '#333333',   // body/label text
    n8: '#111111',   // heading / title text
    n9: '#000000',   // spines, ticks, ink
    nInverse: '#FFFFFF',   // text on dark fills

    s1: '#000000',   // series 1 (primary)
    s2: '#2323FF',   // series 2
    s3: '#4949FF',   // series 3
    s4: '#7070FF',   // series 4
    s5: '#9696FF',   // series 5
    s6: '#BCBCFF',   // series 6
    s7: '#DDD0FF',   // se

    accent: '#243E63',   // selection / highlight
    // Two accents that are not part of the series ramp. Named for the job they
    // do on a chart, not for a mood: `annotation` is the ink of things drawn
    // ON the data (callout leaders, threshold rules), `counter` is the hue for
    // the opposite direction of travel from s2 — bars below the threshold, the
    // mirrored half of a pyramid. Neither means "something is wrong".
    annotation: '#B31B38',   // callout leaders, boxes, threshold rules
    counter: '#9a0060'    // the against-the-grain direction, paired with s2
  };

  Charts.palette = c;

  // ── Metrics ─────────────────────────────────────────────────────────
  // The non-color half of the design system: type sizes, weights, leading,
  // the heading band, callout boxes, strokes, the legend. Colors were already
  // a function of a palette object; these were baked straight into buildTheme,
  // which meant a numeric edit had nowhere to live and `applyPalette` wiped it
  // on the next swatch change. Same shape as the palette now, so both halves
  // round-trip the same way.
  const m = {
    // Type
    font: "'Inter','Segoe UI',Arial,Helvetica,sans-serif",
    titleSize: 17,
    subtitleSize: 12,
    labelSize: 11.5,
    tickSize: 11,
    inlineSize: 11,
    valueSize: 11,
    centerSize: 14,
    pointLabelSize: 10,
    legendSize: 12,
    calloutSize: 10,
    tooltipSize: 12,
    noticeSize: 13,

    // Weights
    titleWeight: 700,
    subtitleWeight: 400,
    categoryWeight: 600,
    tickWeight: 400,
    valueWeight: 700,
    legendWeight: 600,

    // Leading, as RATIOS of the matching size — see the note in buildTheme.
    titleLineHeight: 1.24,
    subtitleLineHeight: 1.34,
    calloutLineHeight: 1.3,

    // Heading band
    headingPadTop: 17,
    headingSubGap: 8,
    headingGap: 18,
    headingGutter: 20,
    plotGap: 16,
    topAxisBand: 20,

    // Callout box
    calloutPad: 8,
    calloutMaxWidth: 220,
    calloutLeaderWidth: 1.2,
    calloutAnchorRadius: 4.5,

    // Strokes
    connectorWidth: 1.4,
    axisWidth: 1.8,
    gridWidth: 0.8,
    lineWidth: 3,
    spineWidth: 1.1,
    tickLength: 6,
    tickWidth: 1.5,

    // Legend
    legendRowHeight: 20,
    legendGap: 18,
    legendIconSize: 12,
    legendIconGap: 6
  };

  Charts.metrics = m;

  // Every theme role is a function OF the palette, not a snapshot of it, so a
  // palette edit at runtime can be replayed through the same mapping instead of
  // being hand-patched role by role. See Charts.applyPalette below.
  function buildTheme(c, m) {
   return {
     // ── Surface ─────────────────────────────────────────────────────────
     bg: c.n0,
     grid: c.n1,
     axis: c.n9,

     // ── Text ────────────────────────────────────────────────────────────
     // Five roles, each separated from its neighbours by BOTH weight and
     // color so no two are mistakable at a glance:
     //
     //   title      17 / 700 / n8   the darkest, heaviest thing on the canvas
     //   subtitle   12 / 400 / n4   lightest — it explains, it is not data
     //   category   11.5 / 600 / n8 names of things: bar rows, donut callouts
     //   tick        11 / 400 / n7  the numeric scale, quiet by design
     //   value       11 / 700 / n8  the readout the reader came for
     //
     // Subtitle sits at n4 rather than n6 specifically so it cannot be
     // confused with a category label, which is now both darker and semibold.
     titleColor: c.n8,
     subtitleColor: c.n4,
     labelColor: c.n7,
     secondaryColor: c.n4,
     inverseText: c.nInverse,

     categoryColor: c.n8,   // category / series names
     categoryWeight: m.categoryWeight,
     tickColor: c.n7,   // numeric axis ticks
     tickWeight: m.tickWeight,
     valueColor: c.n8,   // data value readouts
     valueWeight: m.valueWeight,

     // ── Accent / semantic ───────────────────────────────────────────────
     // `muted` is the fill for everything that is NOT the point of the chart:
     // the bars outside the top two, the lines behind the focus line. It is a
     // neutral, never a second hue — two hues read as two categories, one hue
     // plus a neutral reads as "these matter, those are context".
     muted: c.n3,
     // Ordered de-emphasis ramp, darkest first. Use when the context itself has
     // internal order worth keeping (a muted cluster, the tail of a donut).
     // Two steps is usually plenty; a long grey ramp is just a palette again.
     mutedScale: [c.n3, c.n2, c.n2a],
     highlight: c.accent,
     callout: c.annotation,
     // A bar or line segment is colored by which side of the series threshold
     // (zero, unless the series sets one) it falls on — so the roles are named
     // for the threshold, not for "good" and "bad". A -3% headcount change and
     // a -3°C temperature are the same geometry and neither is a value
     // judgement. `positive`/`negative` remain as aliases for existing configs.
     aboveThreshold: c.s2,
     belowThreshold: c.counter,
     positive: c.s2,
     negative: c.counter,
     // Good and bad, used only when a chart is told which way is better
     // (automatic charts' `better` hint, a dumbbell's `better`). Taken from
     // the theme's own directional pair, never a colour of their own, so a
     // palette or preset change recolours them with everything else.
     favorable: c.s2,
     unfavorable: c.counter,
     trend: c.s2,
     connectorLabel: c.n5,
     connectorLine: c.n7,   // donut callout rule — darker than the label text it carries
     connectorWidth: m.connectorWidth,

     // ── Chrome (interaction surfaces, not data) ─────────────────────────
     // These used to be hex literals inside the engines, which meant a reskin
     // of theme.js left tooltips and dimmed legend keys on the old palette.
     tooltipBorder: c.n1,   // tooltip box hairline
     // Surface of a small repeated panel that sits ON the canvas — a geofacet
     // tile, and anything else that must read as a distinct box rather than a
     // hole in the page. It has to be a real step away from `bg`: a near-white
     // tile on a cream canvas is invisible, and the whole point of a tile map is
     // that you can see the tiles.
     tileSurface: c.n0a,   // panel/tile fill, one soft step darker than bg
     tileTrack: c.n0,   // empty part of a bar/ring drawn on a tile
     dimmed: c.n2a,   // legend key for a series toggled off
     hoverInk: c.n9,   // ink of the low-opacity hover/crosshair wash

     // ── Series palette ──────────────────────────────────────────────────
     colors: [c.s1, c.s2, c.s3, c.s4, c.s5, c.s6, c.s7],
     defaultColor: c.s1,

     // ── Gradient endpoints (bubble size scale) ──────────────────────────
     // A sequential encoding, so two ends of one ramp. Categorical marks (pie
     // slices, packed bubbles) take `colors` in order instead.
     gradientStart: c.s1,
     gradientEnd: c.s2,

     // ── Typography ──────────────────────────────────────────────────────
     font: m.font,
     titleSize: m.titleSize,
     subtitleSize: m.subtitleSize,
     labelSize: m.labelSize,
     tickSize: m.tickSize,
     inlineSize: m.inlineSize,
     valueSize: m.valueSize,
     centerSize: m.centerSize,
     pointLabelSize: m.pointLabelSize,
     legendSize: m.legendSize,
     calloutSize: m.calloutSize,
     tooltipSize: m.tooltipSize,
     noticeSize: m.noticeSize,   // the guard / empty-state headline an engine draws in place of a chart

     // Weights for the two heading roles and the legend. These were literals
     // inside all nine engines, which meant `titleSize` was themeable but the
     // weight beside it was not — a lighter-weight reskin could change the size
     // of a title and nothing else.
     titleWeight: m.titleWeight,
     subtitleWeight: m.subtitleWeight,
     legendWeight: m.legendWeight,

     // ── Vertical rhythm ─────────────────────────────────────────────────
     // Line heights are RATIOS, not pixels. As fixed pixels (they were 21 and
     // 16) a two-line title collided with itself the moment `titleSize` went
     // past ~17, which made the size token unusable for anything but small
     // adjustments. At the default sizes these still round to 21 and 16.
     titleLineHeight: m.titleLineHeight,
     subtitleLineHeight: m.subtitleLineHeight,
     calloutLineHeight: m.calloutLineHeight,

     // ── Strokes / weights ───────────────────────────────────────────────
     axisWidth: m.axisWidth,
     gridWidth: m.gridWidth,
     lineWidth: m.lineWidth,
     spineWidth: m.spineWidth,
     tickLength: m.tickLength,
     tickWidth: m.tickWidth,

     // ── Heading block ───────────────────────────────────────────────────
     // The title/subtitle band above every plot. `padTop` is the distance from
     // the top edge to the first title baseline less the title size; `subGap`
     // the extra leading before the first subtitle line; `gap` the clearance
     // under the whole band before the plot starts; `gutter` the left inset the
     // heading shares with the legend.
     //
     // `gap` was 18 in six engines, 26 in waffle and 24-or-nothing in geofacet,
     // so headings sat at three different heights on one dashboard. One token
     // now, and 18 is the value the majority already used.
     headingPadTop: m.headingPadTop,
     headingSubGap: m.headingSubGap,
     headingGap: m.headingGap,
     headingGutter: m.headingGutter,
     // Clearance between the heading band — title, subtitle, and the legend
     // when there is one — and the top of the plot. This was a literal in every
     // engine and it had drifted to three values: 8 in line/column/scatter/
     // donut/geofacet/histogram, 34 in the horizontal bar, and 0 in the
     // row-based engines, plus another 18 that only existed when a legend was
     // present. So the gap under a subtitle was cramped on a chart with no
     // legend and no two chart types in a grid started their plots on the same
     // line. One token now, applied whether or not a legend is drawn.
     plotGap: m.plotGap,
     // Extra band above the plot for an axis whose labels sit on TOP of it —
     // the horizontal bar is the only engine that does this. Named rather than
     // folded into plotGap so it is clear why that one chart differs.
     topAxisBand: m.topAxisBand,

     // ── Callout / annotation box ────────────────────────────────────────
     calloutPad: m.calloutPad,
     calloutMaxWidth: m.calloutMaxWidth,
     calloutLeaderWidth: m.calloutLeaderWidth,
     calloutAnchorRadius: m.calloutAnchorRadius,

     // ── Legend ──────────────────────────────────────────────────────────
     legendRowHeight: m.legendRowHeight,
     legendGap: m.legendGap,
     legendIconSize: m.legendIconSize,
     legendIconGap: m.legendIconGap
   };
  }

  Charts.theme = buildTheme(c, m);

  // ── Presets ─────────────────────────────────────────────────────────
  // A preset is a whole visual identity, not a swatch: the full 23-key palette
  // and, where the style demands it, the handful of metrics that carry it (a
  // Bauhaus chart is not just red and blue, it is thick strokes and heavy
  // titles). Every preset declares every palette key, so switching between two
  // of them can never leave a stray hue behind from the one before.
  //
  // The rules each of them keeps:
  //   • n0 → n9 runs light → dark ON THE PAGE, so a dark preset inverts the
  //     ramp rather than inventing new roles: n8/n9 are still "the text that
  //     reads darkest against the canvas", which on Midnight means near-white.
  //   • n3 holds at least 3:1 against n0 — the WCAG 1.4.11 floor for a
  //     graphical object. Below that the muted context fills stop being data.
  //   • The series ramp varies in LIGHTNESS, not only hue, so it survives
  //     greyscale printing and every form of colour blindness.
  //   • `counter` is never the red-green partner of s2. It is picked from a
  //     different axis of the wheel for exactly that reason.
  const presets = {
    default: {
      label: 'Default',
      note: 'Warm paper, black-to-periwinkle ramp. The library’s own voice.',
      palette: Object.assign({}, c),
      metrics: {}
    },

    // Everything below is a SINGLE-HUE identity: the seven series slots are one
    // hue walked down a lightness ramp in OKLCH, not seven hues chosen to be
    // told apart. That is the trade. A monochrome ramp reads as one family and
    // orders itself — first slot to last is a sequence a reader can follow
    // without a legend — but it leans on lightness alone to separate the
    // series, so it suits ordered or few-series data, not eight unrelated
    // categories. Adjacent steps are kept at ΔE 8 or better so the leaning
    // holds up.
    //
    // `annotation` and `counter` are the deliberate exceptions in each one.
    // They are roles that must NOT read as data, so they are the only places a
    // second hue appears, pulled from the far side of the wheel from the ramp.

    rubric: {
      label: 'Rubric',
      note: 'Garnet on warm paper. Text serif, tight scale, margin notes set as blocks.',
      palette: {
        n0: '#fbfaf9', n0a: '#f1eeed', n1: '#e1dddb',
        n3: '#898381', n2: '#9e9897', n2a: '#bab4b3',
        n4: '#716c6a', n5: '#615c5b', n6: '#524d4c',
        n7: '#3f3b39', n8: '#1c1817', n9: '#0c0807',
        nInverse: '#ffffff',
        s1: '#561d1d', s2: '#803432', s3: '#9e534f', s4: '#b9746f',
        s5: '#cd948f', s6: '#e0b5b1', s7: '#eed4d1',
        // Navy for the callout ink and teal for the counter-direction: on a
        // red chart a red annotation is just another bar.
        accent: '#6b504e', annotation: '#334f6d', counter: '#207070'
      },
      // An annotated manuscript: small, dense type with the margin note
      // treated as a first-class object rather than a tooltip that got stuck.
      // The callout box is half again as wide as the default, padded like a
      // block quote, and hung off a leader heavy enough to read as drawn in
      // the same ink as the text.
      metrics: {
        font: "'Charter','Bitstream Charter','Source Serif Pro',Cambria,Georgia,serif",
        titleSize: 16, subtitleSize: 11.5, labelSize: 11, tickSize: 10,
        valueSize: 10.5, legendSize: 11, calloutSize: 11,
        titleWeight: 600, subtitleWeight: 400, valueWeight: 600,
        titleLineHeight: 1.2, subtitleLineHeight: 1.4, calloutLineHeight: 1.4,
        calloutPad: 11, calloutMaxWidth: 300, calloutLeaderWidth: 1.6,
        calloutAnchorRadius: 3.5,
        lineWidth: 2, gridWidth: 0.5, axisWidth: 1.2, spineWidth: 0.9,
        tickLength: 4, tickWidth: 1,
        headingPadTop: 16, headingGap: 16, plotGap: 14,
        legendRowHeight: 18, legendIconSize: 10, legendIconGap: 5
      }
    },

    editorial: {
      label: 'Ink & Ochre',
      note: 'Newsprint stock, earth ramp, big serif headline over a dense scale.',
      palette: {
        n0: '#faf6ee', n0a: '#eee6d6', n1: '#e0d8c8',
        n3: '#857c70', n2: '#9d9385', n2a: '#bcb3a3',
        n4: '#6b6355', n5: '#5b5449', n6: '#4a443b',
        n7: '#38332c', n8: '#1c1814', n9: '#100d0a',
        nInverse: '#faf6ee',
        s1: '#1c1814', s2: '#ad5518', s3: '#cf8033', s4: '#dfa25c',
        s5: '#ebc38c', s6: '#f2dcb6', s7: '#f7ead6',
        accent: '#7a3b12', annotation: '#8c1c13', counter: '#2f6b6f'
      },
      // A broadsheet column: a big serif headline over a tight, quiet body.
      // The whole scale below the title shrinks and the leading closes up,
      // because a newspaper chart earns its space by being dense — and the
      // legend is set small and close, the way a key under a printed figure is.
      metrics: {
        font: "'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif",
        titleSize: 20, subtitleSize: 11.5, labelSize: 11, tickSize: 10,
        valueSize: 10.5, inlineSize: 10.5, legendSize: 11, calloutSize: 10,
        titleWeight: 600, subtitleWeight: 400, categoryWeight: 700, valueWeight: 700,
        titleLineHeight: 1.16, subtitleLineHeight: 1.3,
        headingPadTop: 18, headingSubGap: 6, headingGap: 16, plotGap: 13,
        lineWidth: 2.5, gridWidth: 0.5, axisWidth: 1.6, spineWidth: 1.4,
        tickLength: 5, tickWidth: 1.2,
        legendRowHeight: 17, legendGap: 14, legendIconSize: 9, legendIconGap: 5
      }
    },

    botanical: {
      label: 'Botanical',
      note: 'Low-chroma sage, humanist type, hairline rules. Quiet in colour and in spacing.',
      palette: {
        n0: '#f8fbf9', n0a: '#eaf0eb', n1: '#d8e1d9',
        n3: '#7d887e', n2: '#929d94', n2a: '#afb9b0',
        n4: '#667068', n5: '#576158', n6: '#485149',
        n7: '#353f37', n8: '#141c15', n9: '#050b06',
        nInverse: '#ffffff',
        s1: '#12452c', s2: '#266645', s3: '#498362', s4: '#6c9e80',
        s5: '#90b79f', s6: '#b3d0be', s7: '#d2e3d8',
        accent: '#325642', annotation: '#8d3a2f', counter: '#6b588d'
      },
      // A field guide: humanist type, thin rules and a lot of air. Everything
      // that can be lighter is lighter — the axis is a hairline, the ticks are
      // stubs, the title drops to semibold — and every gap opens up, because
      // the quiet in this preset is spacing as much as it is chroma.
      metrics: {
        font: "'Optima','Gill Sans MT','Gill Sans','Segoe UI',Candara,sans-serif",
        titleSize: 17, subtitleSize: 12.5, labelSize: 11.5, tickSize: 11,
        legendSize: 12, calloutSize: 10.5,
        titleWeight: 600, categoryWeight: 500, valueWeight: 600, legendWeight: 500,
        titleLineHeight: 1.3, subtitleLineHeight: 1.45, calloutLineHeight: 1.4,
        headingPadTop: 22, headingSubGap: 10, headingGap: 24,
        headingGutter: 24, plotGap: 20,
        lineWidth: 2.5, gridWidth: 0.6, axisWidth: 1.2, spineWidth: 0.9,
        tickLength: 4, tickWidth: 1,
        calloutPad: 10, calloutAnchorRadius: 4,
        legendRowHeight: 22, legendGap: 22, legendIconSize: 10, legendIconGap: 8
      }
    },

    cyanotype: {
      label: 'Cyanotype',
      note: 'Dark. Muted teal, monospaced throughout, tabular figures. A measured plate.',
      palette: {
        n0: '#111719', n0a: '#1d2426', n1: '#2b3538',
        n3: '#758387', n2: '#89969a', n2a: '#9faaad',
        n4: '#929ea1', n5: '#a1abae', n6: '#b4bcbe',
        n7: '#cfd6d7', n8: '#f0f4f5', n9: '#e4e9ea',
        nInverse: '#111719',
        // On a dark ground the ramp runs the other way: s1 is the brightest,
        // because the first series should be the one that carries furthest.
        // The s1→s2 step is wider than the rest on purpose (ΔE 13 against the
        // ramp's 8): a two-series chart only ever uses those two, and in a
        // legend chip at 12px an even step reads as one colour twice.
        s1: '#9fdfef', s2: '#63c0d6', s3: '#45abc1', s4: '#3695a9',
        s5: '#2c7f91', s6: '#276a78', s7: '#235560',
        accent: '#22454e', annotation: '#dbb87e', counter: '#d08b6c'
      },
      // A measured plate. Monospaced throughout, which is the whole point: on
      // a technical drawing the numbers are the subject, and tabular figures
      // stop a column of readouts from wobbling. Long ticks and a heavy spine
      // give the plot a drawn frame; the data line is thin because on this
      // ground a thick one glows.
      metrics: {
        font: "'IBM Plex Mono','Cascadia Mono',Consolas,'SF Mono',ui-monospace,monospace",
        titleSize: 15.5, subtitleSize: 11, labelSize: 10.5, tickSize: 10,
        valueSize: 10, inlineSize: 10, legendSize: 10.5, calloutSize: 9.5,
        pointLabelSize: 9.5, tooltipSize: 11,
        titleWeight: 600, subtitleWeight: 400, categoryWeight: 500,
        valueWeight: 600, legendWeight: 500,
        titleLineHeight: 1.28, calloutLineHeight: 1.35,
        headingPadTop: 16, headingGap: 16, plotGap: 14,
        lineWidth: 2, gridWidth: 0.5, axisWidth: 1.8, spineWidth: 1.2,
        tickLength: 9, tickWidth: 1.2,
        calloutPad: 7, calloutMaxWidth: 200, calloutLeaderWidth: 1,
        calloutAnchorRadius: 3,
        legendRowHeight: 18, legendGap: 16, legendIconSize: 9, legendIconGap: 6
      }
    },

    orchid: {
      label: 'Orchid',
      note: 'Dark. Mauve through plum, neutral grotesque set a size up. Built for a room.',
      palette: {
        n0: '#181519', n0a: '#252126', n1: '#363138',
        n3: '#847d87', n2: '#97919a', n2a: '#aba5ad',
        n4: '#9f99a0', n5: '#aca7ae', n6: '#bdb9be',
        n7: '#d6d3d7', n8: '#f5f2f5', n9: '#e9e7ea',
        nInverse: '#181519',
        s1: '#e6c5f0', s2: '#ca9ed8', s3: '#b588c3', s4: '#9e75ab',
        s5: '#876392', s6: '#705379', s7: '#5a4361',
        accent: '#4a3f52', annotation: '#d5c484', counter: '#7dbb9a'
      },
      // Built to be read from the back of a room, which is a reason to set
      // everything a size up — not a licence to shout. A neutral grotesque, a
      // 3px line, and ticks kept short rather than deleted: at projection
      // distance a tick still tells you the gridline is a reading and not a
      // rule. The legend gets real row pitch for the same reason.
      metrics: {
        font: "'Poppins','Century Gothic','Futura','Avenir Next','Segoe UI',sans-serif",
        titleSize: 20, subtitleSize: 13, labelSize: 12, tickSize: 11.5,
        valueSize: 12, inlineSize: 12, centerSize: 16, legendSize: 12.5,
        calloutSize: 11.5, tooltipSize: 13, noticeSize: 15,
        titleWeight: 700, subtitleWeight: 400, categoryWeight: 600,
        valueWeight: 700, legendWeight: 600,
        titleLineHeight: 1.2, subtitleLineHeight: 1.35,
        headingPadTop: 20, headingSubGap: 9, headingGap: 22,
        headingGutter: 22, plotGap: 20, topAxisBand: 24,
        lineWidth: 4, gridWidth: 0.5, axisWidth: 1.2, spineWidth: 0.9,
        tickLength: 0, tickWidth: 0.5,
        calloutPad: 10, calloutMaxWidth: 240, calloutLeaderWidth: 1.6,
        calloutAnchorRadius: 5,
        legendRowHeight: 24, legendGap: 22, legendIconSize: 14, legendIconGap: 8
      }
    },

    // The one CATEGORICAL identity in the set, and a deliberate exception to
    // the single-hue rule above: the Bauhaus primaries (HueAtlas: red #C8302A,
    // yellow #E8C018, blue #1E3878 on Studio White #F5F2E8 and Black #1A1A18).
    // It is dark because that is where the palette works as data. The earlier
    // Bauhaus preset put the yellow on white at 1.95:1; on Bauhaus Black the
    // same yellow is 9.9:1 and becomes the series that carries furthest.
    //
    //   • Red and blue are lifted for the ground (blue all the way to a sky
    //     tint so s2 takes black text at 6.4:1); white is the fourth primary.
    //   • s5–s7 are the deep blue, deep red and a pale blue tail, so the ramp
    //     still walks lightness. Worst s1–s4 pair under any CVD simulation is
    //     ΔE 16; worst over all seven is ΔE 11.
    //   • `counter` repeats s3's red on purpose, as Okabe–Ito once did:
    //     blue against red is the Bauhaus opposition, and a threshold chart is
    //     single-series so s3 is never on it.
    //   • Callout ink is Workshop Gold, the palette's own detail colour —
    //     the one hue that is not a series in the first four slots.
    bauhausNight: {
      label: 'Bauhaus Night',
      note: 'Dark. Yellow, blue, red and white on Bauhaus Black, geometric type, heavy rules.',
      palette: {
        n0: '#1a1a18', n0a: '#262622', n1: '#36352f',
        n3: '#8a8680', n2: '#9d9992', n2a: '#b1ada5',
        n4: '#a9a59d', n5: '#b8b4ac', n6: '#c8c4bb',
        n7: '#ddd9cf', n8: '#f5f2e8', n9: '#ebe7dc',
        nInverse: '#1a1a18',
        s1: '#e8c018', s2: '#86a2ea', s3: '#e5483e', s4: '#f5f2e8',
        s5: '#4a68c0', s6: '#a8302a', s7: '#c4d0ee',
        accent: '#2a3a68', annotation: '#c89620', counter: '#e5483e'
      },
      // A poster, so the rules are drawn rather than hinted: a heavy axis and
      // spine, 3.5px lines, square legend keys a size up. Geometric type for
      // the same reason — Futura where it exists, Century Gothic on Windows.
      metrics: {
        font: "'Futura','Century Gothic','Avenir Next','Josefin Sans',Arial,sans-serif",
        titleSize: 20, titleWeight: 700, categoryWeight: 600,
        valueWeight: 700, legendWeight: 600,
        lineWidth: 3.5, axisWidth: 2, gridWidth: 0.6, spineWidth: 1.4,
        tickLength: 6, tickWidth: 1.6,
        calloutLeaderWidth: 1.6, calloutAnchorRadius: 4.5,
        legendIconSize: 13
      }
    }
  };

  Charts.presets = presets;

  // The pristine metric values, captured before any preset has run, plus the
  // union of every metric key any preset touches. Switching presets restores
  // that union first, so leaving Bauhaus takes its 4.5px strokes with it
  // instead of stranding them on a preset that never asked for them.
  const metricDefaults = Object.assign({}, m);
  const presetMetricKeys = Object.keys(presets).reduce(function (set, name) {
    Object.keys(presets[name].metrics).forEach(function (k) { set[k] = true; });
    return set;
  }, {});

  /**
   * Swap the whole visual identity. Applies the preset's palette in full and
   * its metric overrides on top of the shipped metric defaults.
   *
   * @param {string} name  a key of Charts.presets
   * @returns {Object} the updated Charts.theme
   */
  Charts.applyPreset = function (name) {
    const p = presets[name];
    if (!p) return Charts.theme;
    const metrics = {};
    for (const k in presetMetricKeys) metrics[k] = metricDefaults[k];
    Object.assign(metrics, p.metrics);
    Charts.applyPalette(p.palette);
    return Charts.applyMetrics(metrics);
  };

  /**
   * Re-derive every palette-backed theme role from a set of palette edits.
   * Used by the theme editor page (charts-lib/theme-editor.html) to make a
   * swatch change show up in a re-rendered chart.
   *
   * Writes into the EXISTING Charts.theme object rather than replacing it, so
   * per-page overrides of non-palette roles (sizes, weights, font) survive and
   * anything holding a reference to Charts.theme keeps seeing live values.
   *
   * @param {Object} overrides  palette keys → hex, e.g. { n0: '#ffffff' }
   * @returns {Object} the updated Charts.theme
   */
  Charts.applyPalette = function (overrides) {
    if (overrides) for (const k in overrides) {
      if (Object.prototype.hasOwnProperty.call(c, k)) c[k] = overrides[k];
    }
    return Object.assign(Charts.theme, buildTheme(c, m));
  };

  /**
   * The metrics half of the same contract: re-derive every metric-backed theme
   * role from a set of edits to sizes, weights, leading, spacing or strokes.
   *
   * Kept separate from applyPalette so each half can be edited without the
   * other having to be replayed, but both rebuild from the same two objects —
   * so a swatch change no longer discards a type-scale change, which is what
   * happened while these values were literals inside buildTheme.
   *
   * Unknown keys are ignored, exactly as applyPalette ignores unknown swatches.
   *
   * @param {Object} overrides  metric keys → value, e.g. { titleSize: 20 }
   * @returns {Object} the updated Charts.theme
   */
  Charts.applyMetrics = function (overrides) {
    if (overrides) for (const k in overrides) {
      if (Object.prototype.hasOwnProperty.call(m, k)) m[k] = overrides[k];
    }
    return Object.assign(Charts.theme, buildTheme(c, m));
  };
})();
</script>
<script>
/*!
 * motion-lib/core.js — compile a spec into a timeline; paint any frame.
 *
 * A video is a card layer over a living stage: each scene is a beat whose
 * words sit in the card (the shared frame plus the beat's headline, units,
 * figure or flat chart), and the stage (stage.js) runs under every beat
 * without a break, painted first on every frame.
 *
 *   const C = Motion.compile(spec, 'main');      // pure; throws naming the scene
 *   Motion.seek(ctx, C, t, { frameT });           // paints the frame at time t
 *
 * Every frame is a pure function of t. No timers, no Math.random, no state
 * carried between frames: frames can be drawn in any order (export, motion
 * blur, the audit) and come out the same.
 *
 * A scene's local timeline:
 *
 *   t0 ── ovIn ──┬── enter ──┬── hold ──┬── exit ──┬── ovOut ── t1
 *   (transition  │ layers    │ every    │ layers   │ (transition
 *    from prev)  │ reveal    │ layer in │ leave    │  to next)
 *
 * ovIn of a scene is the same stretch of time as ovOut of the one before, so
 * outgoing text has always left before incoming text arrives. Every scene
 * after the first arrives by the same transition (transitions.js); the
 * spec's old `transitionIn` is ignored. Reading starts when the headline
 * lands, so the hold is what the read still needs after the entrance.
 */
(function (root) {
  'use strict';
  const M = root.Motion = root.Motion || {};
  M.scenes = M.scenes || {};
  M.custom = M.custom || {};
  M.version = '0.1.0';

  // ── seeded hash rng: stable for (seed, keys) whatever the draw order ──
  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed, ...keys) {
    let a = hashStr(String(seed) + '|' + keys.join('|'));
    return function () {   // mulberry32
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function registerScene(def) {
    if (!def || !def.type || typeof def.build !== 'function') throw new Error('registerScene: need { type, build }');
    M.scenes[def.type] = def;
  }

  // ── read-time rule ───────────────────────────────────────────────────
  // Each reading layer is on screen, fully revealed, for
  // max(1.2 s, 0.5 s + 0.25 s per word). A big number holds 1.5 s after it lands.
  const READ = { min: 1.2, base: 0.5, perWord: 0.25, number: 1.5, source: 2.0, final: 1.0 };
  const readTime = words => Math.max(READ.min, READ.base + READ.perWord * words);
  const EXIT = 0.35;

  // ── claims → copy ────────────────────────────────────────────────────
  // Copy refers to figures by claim id: "{F1}" inside a string, or a slot
  // whose whole value is "F1". Typed numbers are a lint failure (check-video).
  function resolver(spec) {
    const claims = {};
    (spec.claims || []).forEach(c => { claims[c.id] = c; });
    const sources = {};
    (spec.sources || []).forEach(s => { sources[s.id] = s; });
    const data = {};
    (spec.data || []).forEach(d => { data[d.id] = d; });
    function claim(id, where) {
      const c = claims[id];
      if (!c) throw new Error(where + ': unknown claim "' + id + '"');
      return c;
    }
    function fill(str, where, used) {
      if (str == null) return '';
      return String(str).replace(/\{([A-Za-z][\w.-]*)\}/g, (_, id) => {
        const c = claim(id, where);
        if (used) used.add(id);
        return c.display != null ? c.display : String(c.value);
      });
    }
    return { claims, sources, data, claim, fill };
  }

  // ── compile ──────────────────────────────────────────────────────────
  function compile(spec, cutName, opts) {
    opts = opts || {};
    if (!spec || !spec.meta) throw new Error('spec: missing "meta"');
    const cuts = spec.cuts || {};
    const name = cutName || Object.keys(cuts)[0];
    const cut = cuts[name];
    if (!cut) throw new Error('spec: no cut named "' + name + '"');
    const fr = M.layout.frame(cut.format || '9:16');
    const fps = spec.meta.fps || 30;
    if ([24, 25, 30, 60].indexOf(fps) < 0) throw new Error('meta.fps must be 24, 25, 30 or 60');
    const design = M.design.resolve(spec.meta);
    const R = resolver(spec);
    const ctx = opts.measure || M.measureContext();
    const byId = {};
    (spec.scenes || []).forEach(s => { byId[s.id] = s; });
    if (!M.stage) throw new Error('motion-lib/stage.js must load before the scenes are compiled');

    // Build every scene. The footer is shared, so its height is the most any
    // scene's source line needs: build once to find it, and again if any
    // scene laid itself out for a different footer.
    const build = footerRows => cut.scenes.map((id, i) => {
      const s = byId[id];
      if (!s) throw new Error('cut "' + name + '": no scene with id "' + id + '"');
      const def = M.scenes[s.type];
      if (!def) throw new Error('scene "' + id + '": unknown type "' + s.type + '"');
      const used = new Set();
      const api = {
        ctx, frame: fr, design, spec, R, index: i, sceneId: id,
        copy: (slot, fallback) => R.fill(s.copy && s.copy[slot] != null ? s.copy[slot] : fallback, 'scene "' + id + '" copy.' + slot, used),
        claim: cid => { used.add(cid); return R.claim(cid, 'scene "' + id + '"'); },
        used: () => [...used],
        reserved: [],   // data areas the art keeps clear of, beyond the layers' own boxes
        footerRows,     // the video's footer height in source rows (null on the first pass)
        footerUsed: null, chrome: null,   // set by card(): the rows it laid out for, and its kicker and source line
        trIn: M.transitions.get(i === 0 ? 'cut' : 'swap'),
        T: M.text, L: M.layout
      };
      let built;
      try { built = def.build(s, api); } catch (e) { throw new Error('scene "' + id + '" (' + s.type + '): ' + e.message); }
      const rv = api.trIn.reveal || 'mask-up';
      built.layers.forEach(l => { if (l.kind === 'text' && !l.reveal) l.reveal = rv; });
      return { spec: s, def, built, used: [...used], id, type: s.type, reserved: api.reserved, chrome: api.chrome, footerUsed: api.footerUsed };
    });
    let list = build(null);
    const rows = Math.max(0, ...list.map(it => (it.chrome && it.chrome.source ? it.chrome.source.length : 0)));
    if (list.some(it => it.footerUsed != null && it.footerUsed !== rows)) list = build(rows);
    const zone = M.design.frameZone(fr, rows);
    // The stage: its shape's plan, and the room each beat leaves it. The art
    // keeps clear of the stage as well as the words.
    const stage = M.stage.plan({ list, fr, zone, design, spec, R });
    list.forEach((it, i) => { const b = stage.boxes[i]; it.reserved.push({ x: b.x, y: b.y, w: b.w, h: b.h }); });
    // Between two beats: the one swap, held longer while the stage changes.
    const between = i => {
      if (i === 0) return M.transitions.get('cut');
      const wait = M.stage.travel(stage, i);
      return wait > 0 ? Object.assign({}, M.transitions.get('travel'), { dur: wait }) : M.transitions.get('swap');
    };
    // What a scene's chrome occupies, for the art to keep clear of: the bar,
    // its kicker, the footer's hairline and its source line.
    const chromeBoxes = ch => {
      if (!ch) return [];
      const S = fr.safe, out = [{ x: S.x, y: S.y, w: M.layout.RULE.accentW, h: M.layout.RULE.accentH }];
      if (ch.kicker) out.push({ x: ch.kicker.x, y: ch.kicker.y, w: ch.kicker.w, h: ch.kicker.h });
      if (rows) out.push({ x: S.x, y: zone.ruleY - 2, w: S.w, h: 4 });
      if (ch.source) ch.source.runs.forEach(run => out.push({ x: run.x, y: run.y, w: run.w, h: run.h }));
      return out;
    };

    // Timing. With a soundtrack on and a bpm, every scene's content starts on
    // a beat: the scene before it holds a little longer to get there.
    const audio = spec.meta.audio || {};
    const bpm = audio.score && audio.score !== 'off' ? (audio.bpm || 112) : null;
    const beat = bpm ? 60 / bpm : 0;
    const scenes = [];
    const art = M.art ? M.art.resolve(spec.meta) : null;
    const artGrid = art ? M.art.grid(fr, spec.meta.seed || 0) : null;
    let artPrev = null;
    let t = 0;
    list.forEach((it, i) => {
      const b = it.built;
      const nextSpec = list[i + 1] && list[i + 1].spec;
      const trIn = between(i);
      const trOut = nextSpec ? between(i + 1) : null;
      const last = i === list.length - 1;
      const landed = l => (l.at || 0) + (l.dur || 0);
      const enter = b.layers.reduce((mx, l) => Math.max(mx, landed(l)), 0);
      const read = b.read != null ? b.read : 1.2;
      const exit = last || (trOut && trOut.ownsExit) ? 0 : EXIT;
      // The scene's read starts when its headline lands, alongside the rest of
      // the entrance; every layer that lands later still gets its own time
      // on screen once it has.
      const heads = b.layers.filter(l => l.role === 'headline');
      const readFrom = heads.length ? Math.max(...heads.map(landed)) : enter;
      const words = l => (l.lines ? l.lines.reduce((n, ln) => n + M.text.wordCount(ln.text), 0) : 0);
      const need = l => (l.role === 'value' ? READ.number : l.role === 'label' || l.role === 'tick' ? READ.min : l.kind === 'text' ? readTime(words(l)) : 0);
      const own = b.layers.reduce((mx, l) => Math.max(mx, landed(l) + need(l) - enter), 0);
      const hold = Math.max(read - (enter - readFrom), own, 0.5);
      const holdFloor = last ? Math.max(hold, READ.final) : hold;
      const minDur = enter + holdFloor + exit;
      let dur = minDur;
      if (it.spec.dur != null && it.spec.dur !== 'auto') {
        const d = +it.spec.dur;
        if (!(d > 0)) throw new Error('scene "' + it.id + '": dur must be "auto" or seconds');
        if (d + 1e-6 < minDur) {
          throw new Error('scene "' + it.id + '": dur ' + d + ' s is below its minimum ' + minDur.toFixed(2) +
            ' s (enter ' + enter.toFixed(2) + ' + hold ' + holdFloor.toFixed(2) + ' + exit ' + exit.toFixed(2) + ')');
        }
        dur = d;
      }
      const chrome = b.rule ? placeChrome(it.chrome, fr, zone, design, ctx) : null;
      // The art's dot sizes for this scene: they shrink away near everything
      // it shows. The same sizes as the scene before come back as the very
      // same array, so the art doesn't move between them. A scene can refuse
      // art (art: false), as the outro does with its own logo.
      let artAt = null;
      if (art && b.art !== false) artAt = M.art.sizes(artGrid, M.art.boxes(b.layers, it.reserved.concat(chromeBoxes(chrome)), ctx), artPrev);
      artPrev = artAt;
      const ovIn = i === 0 ? 0 : trIn.dur;
      const ovOut = trOut ? trOut.dur : 0;
      if (beat && !last) {
        const nextStart = t + dur + ovOut;
        dur += Math.ceil(nextStart / beat - 1e-9) * beat - nextStart;
      }
      const t0 = i === 0 ? 0 : t - ovIn;
      const cStart = t0 + ovIn;
      const exitStart = cStart + dur - exit;
      const cEnd = cStart + dur;
      const t1 = cEnd + ovOut;
      scenes.push({
        id: it.id, type: it.type, index: i, def: it.def, spec: it.spec, built: b,
        layers: b.layers, rule: b.rule || null, used: it.used, art: artAt, chrome, reserved: it.reserved,
        t0, t1, cStart, enterEnd: cStart + enter, exitStart, cEnd, ovIn, ovOut,
        enter, read: holdFloor, exit, minDur, dur, trIn, trOut, last
      });
      t = cEnd + ovOut;
    });
    // The last scene has no ovOut, so t is its content end. Whole frames.
    const frames = Math.round(t * fps);
    const duration = frames / fps;
    M.stage.finish(stage, scenes);

    return {
      cut: name, format: fr.format, W: fr.W, H: fr.H, cls: fr.cls, profile: fr.profile, safe: fr.safe, fps, frames, duration, stage, shape: stage.st.shape,
      scenes, zone, design, art: art ? Object.assign({ tone: M.art.tone(design), grid: artGrid }, art) : null, seed: spec.meta.seed || 0, grain: spec.meta.grain || 0, bpm, spec, R,
      images: opts.images || M.images || {}
    };
  }

  // A scene's kicker and source line, placed in the shared frame. `key` says
  // whether two scenes' words are the same, in which case nothing changes
  // between them.
  function placeChrome(ch, fr, zone, design, ctx) {
    const S = fr.safe, TY = M.layout.typeFor(fr), d = design;
    const out = { kicker: null, source: null };
    if (ch && ch.kicker) {
      const f = M.text.font(400, TY.kicker.size, d.font);
      const ln = M.text.place(ctx, [ch.kicker], f, S.x, zone.kickerY, TY.kicker.lh, 'left', S.w)[0];
      out.kicker = { key: ch.kicker, font: f, size: TY.kicker.size, color: d.muted, x: ln.x, y: ln.y, w: ln.w, h: ln.h, text: ln.text };
    }
    if (ch && ch.source) {
      const runs = [];
      ch.source.forEach((row, ri) => row.forEach(run => runs.push({
        text: run.text, font: run.f, color: run.strong ? d.ink : d.muted,
        x: S.x + run.x, y: zone.rowsY + ri * TY.source.lh, w: run.w, h: TY.source.lh
      })));
      out.source = { key: ch.source.map(row => row.map(r => r.text).join('')).join('\n'), runs, size: TY.source.size };
    }
    return out;
  }

  // ── layer rendering ──────────────────────────────────────────────────
  // Reveal styles. p is eased 0..1 entering; e is eased 0..1 exiting.
  function drawLayer(ctx, C, sc, L, lt, frameLt) {
    const d = C.design;
    const at = L.at || 0, dur = L.dur || 0.0001;
    if (lt < at) return;
    const raw = Math.min(1, (lt - at) / dur);
    const p = M.ease.get(L.ease || 'outQuint')(raw);
    const exitLen = sc.exit;
    const ex = exitLen > 0 ? Math.max(0, Math.min(1, (lt - (sc.exitStart - sc.cStart)) / exitLen)) : 0;
    const e = M.ease.expoIn(ex);
    if (e >= 1) return;
    ctx.save();
    M.debug.scene = sc.id;
    if (M.debug.record && M.debug.phase !== 'transition') M.debug.phase = e > 0 ? 'exit' : raw < 1 ? 'enter' : 'hold';
    if (e > 0) { ctx.globalAlpha *= 1 - e; ctx.translate(0, -24 * e); }

    if (L.kind === 'text') drawText(ctx, L, p, raw, lt);
    else if (L.kind === 'counter') drawCounter(ctx, C, L, frameLt == null ? lt : frameLt);
    else if (L.kind === 'rect') {
      const g = L.grow || 'x';
      const w = g === 'x' ? L.w * p : L.w, h = g === 'y' ? L.h * p : L.h;
      const y = g === 'y' && L.fromBottom ? L.y + L.h - h : L.y;
      const x = g === 'x' && L.fromRight ? L.x + L.w - w : L.x;
      if (L.hatch) M.paint.hatch(ctx, x, y, w, h, L.color, 14, 3);
      else M.paint.rect(ctx, x, y, w, h, L.color);
    } else if (L.kind === 'hair') {
      const w = L.w * p;
      M.paint.line(ctx, L.x, L.y, L.x + w, L.y, L.color, L.width || M.layout.RULE.hair, L.dash);
    } else if (L.kind === 'draw') {
      L.fn(ctx, p, { lt, raw, C, sc, design: d, paint: M.paint, text: M.text, frameLt: frameLt == null ? lt : frameLt });
    } else if (L.kind === 'image') {
      const img = C.images[L.src];
      if (img) {
        ctx.globalAlpha *= p;
        ctx.save();
        M.paint.clipRect(ctx, L.x, L.y, L.w, L.h);
        // Cover the box at the picture's own size: it never zooms.
        const iw = img.width, ih = img.height;
        const k = Math.max(L.w / iw, L.h / ih);
        ctx.drawImage(img, L.x + (L.w - iw * k) / 2, L.y + (L.h - ih * k) / 2, iw * k, ih * k);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function drawText(ctx, L, p, raw, lt) {
    const style = L.reveal || 'mask-up';
    const lines = L.lines;
    const n = lines.length;
    lines.forEach((ln, i) => {
      if (style === 'fade') {
        M.paint.text(ctx, ln.text, ln.x, ln.y, { font: L.font, color: L.color, h: ln.h, w: ln.w, alpha: p, layer: L.id, role: L.role, size: L.size, large: L.large });
        return;
      }
      if (style === 'brighten') {
        // Words go from muted to ink in reading order; the text is all there from the start.
        const words = ln.words, total = L.wordTotal || 1;
        const shown = M.ease.outQuint(M.ease.clamp01((lt - (L.at || 0)) / 0.35));   // the muted text fades in first
        words.forEach((w, j) => {
          const idx = (L.wordIndex ? L.wordIndex[i] : 0) + j;
          const q = M.ease.clamp01(raw * total - idx);
          M.paint.text(ctx, w.text, w.x, ln.y, { font: L.font, color: L.from || L.color, h: ln.h, w: w.w, alpha: (1 - q) * shown, layer: L.id, role: L.role, size: L.size, large: L.large });
          M.paint.text(ctx, w.text, w.x, ln.y, { font: L.font, color: L.color, h: ln.h, w: w.w, alpha: q, layer: L.id, role: L.role, size: L.size, large: L.large });
        });
        return;
      }
      if (style === 'words') {
        // Words rise through the line's mask, staggered.
        const words = ln.words, total = L.wordTotal || words.length;
        const stag = L.stagger || 0.07;
        words.forEach((w, j) => {
          const idx = (L.wordIndex ? L.wordIndex[i] : 0) + j;
          const local = M.ease.clamp01((lt - (L.at || 0) - idx * stag) / Math.max(0.05, (L.dur || 0.5) - stag * (total - 1)));
          const q = M.ease.outQuint(local);
          if (q <= 0) return;
          ctx.save();
          M.paint.clipRect(ctx, w.x - 4, ln.y - 2, w.w + 8, ln.h + 4);
          M.paint.text(ctx, w.text, w.x, ln.y + (1 - q) * ln.h, { clip: [w.x - 4, ln.y - 2, w.w + 8, ln.h + 4], font: L.font, color: L.color, h: ln.h, w: w.w, alpha: Math.min(1, q * 1.5), layer: L.id, role: L.role, size: L.size, large: L.large });
          ctx.restore();
        });
        return;
      }
      // mask-up (default) / mask-left: each line rises (or slides) through its own mask, lines staggered.
      const stag = n > 1 ? Math.min(0.1, 0.3 / n) : 0;
      const own = Math.max(0.15, (L.dur || 0.6) - stag * (n - 1));
      const q = M.ease.outQuint(M.ease.clamp01((lt - (L.at || 0) - i * stag) / own));
      if (q <= 0) return;
      ctx.save();
      // mask-left reveals from the line's own left edge: nothing shows outside it.
      const cl = style === 'mask-left' ? [ln.x, ln.y - 4, ln.w + 6, ln.h + 8] : [ln.x - 6, ln.y - 4, ln.w + 12, ln.h + 8];
      M.paint.clipRect(ctx, cl[0], cl[1], cl[2], cl[3]);
      const dx = style === 'mask-left' ? -(1 - q) * Math.min(ln.w, 200) : 0;
      const dy = style === 'mask-left' ? 0 : (1 - q) * ln.h;
      M.paint.text(ctx, ln.text, ln.x + dx, ln.y + dy, { clip: cl, font: L.font, color: L.color, h: ln.h, w: ln.w, alpha: Math.min(1, q * 1.4), layer: L.id, role: L.role, size: L.size, large: L.large });
      ctx.restore();
    });
  }

  // Counters read the frame's own time, never the motion-blur subframe time,
  // or the digits smear. They roll on expo-out to the exact value and settle.
  function drawCounter(ctx, C, L, lt) {
    const raw = M.ease.clamp01((lt - (L.at || 0)) / (L.dur || 1));
    // A counter that moves with a picture's units counts at their pace.
    const p = L.countEase === 'linear' ? raw : M.ease.expoOut(raw);
    if (raw <= 0) return;
    const parsed = L.parsed;
    const str = raw >= 1 || !parsed ? L.display : M.text.formatLike(parsed, parsed.value * p);
    drawDigits(ctx, L, str, L.display, L.x, Math.min(1, raw * 4));
  }

  // Digits in tabular cells, right-aligned inside the width of `full` so the
  // unit stays put while they roll. One record for the whole number.
  function drawDigits(ctx, L, str, full, x0, alpha) {
    const tab = M.text.tabular(ctx, str, L.font);
    const fw = M.text.tabular(ctx, full, L.font).w;
    let x = L.align === 'center' ? x0 + (L.boxW - fw) / 2 : x0;
    x += fw - tab.w;
    const r0 = M.debug.record ? M.debug.record.length : 0;
    tab.parts.forEach(pt => {
      const cx = x + pt.x + (pt.w - M.text.measure(ctx, pt.ch, L.font)) / 2;
      M.paint.text(ctx, pt.ch, cx, L.y, { font: L.font, color: L.color, h: L.h, w: pt.w, alpha, layer: L.id + '#' + pt.x, role: 'value-glyph', size: L.size, large: true });
    });
    if (M.debug.record) {
      // One record for the whole number, for overlap/read checks.
      const r = M.debug.record;
      for (let i = r0; i < r.length; i++) r[i].skip = true;
      // In frame pixels, through any transform, like paint.text's records.
      const m = ctx.getTransform ? ctx.getTransform() : { a: 1, d: 1, e: 0, f: 0 };
      r.push({ scene: M.debug.scene, phase: M.debug.phase, layer: L.id, role: L.role || 'value', text: str, bbox: [m.a * x + m.e, m.d * L.y + m.f, tab.w * m.a, L.h * m.d], alpha: ctx.globalAlpha * alpha, size: L.size, color: L.color, large: true });
    }
    return x + tab.w;
  }

  // A scene's content is drawn at its laid-out size, always: the card layer
  // never zooms or moves. Only the stage's camera does, on the world.
  function paintScene(ctx, C, sc, t, frameT) {
    const lt = t - sc.cStart;
    const flt = frameT == null ? null : frameT - sc.cStart;
    for (const L of sc.layers) drawLayer(ctx, C, sc, L, lt, flt);
  }

  function background(ctx, C) {
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.design.bg;
    ctx.fillRect(0, 0, C.W, C.H);
    ctx.restore();
  }

  // ── chrome: the parts every scene shares ─────────────────────────────
  // The accent bar (the through-line), the kicker line under it and the
  // footer (a hairline over the source line) sit in one place for the whole
  // video (C.zone), outside the scenes, and stay still through every
  // transition. Only their words change, and only when the next scene's
  // words differ: a new kicker rolls up through its line's own mask as the
  // old one rolls out, and a new source line fades in where the old one
  // faded out. On the first scene the bar and the hairline draw in and the
  // words rise in; into a scene without chrome (the outro) it all fades out.
  // The bar never changes size between scenes.

  // How far the chrome has arrived at content time lt of sc: null when it
  // was already there in the scene before.
  function arrival(C, sc, lt) {
    const prev = C.scenes[sc.index - 1];
    if (prev && prev.chrome) return null;
    const q = (at, dur, e) => M.ease[e || 'outQuint'](M.ease.clamp01((lt - at) / dur));
    return { bar: q(0, 0.5), kicker: q(0, 0.5), hair: q(0.7, 0.6, 'glide'), source: q(0.8, 0.5) };
  }

  // The bar, drawn in to `shown` (0..1) of its width, at `alpha`.
  function drawBar(ctx, C, shown, alpha) {
    const S = C.safe, R = M.layout.RULE;
    const w = R.accentW * shown;
    if (w <= 0.5 || alpha <= 0.001) return;
    ctx.save(); ctx.globalAlpha *= alpha;
    M.paint.rect(ctx, S.x, S.y, w, R.accentH, C.design.subject);
    ctx.restore();
  }

  // The footer's hairline, drawn in to `shown` of the safe width, at `alpha`.
  function drawHair(ctx, C, shown, alpha) {
    const Z = C.zone, S = C.safe;
    if (!Z.rows || shown <= 0.001 || alpha <= 0.001) return;
    ctx.save(); ctx.globalAlpha *= alpha;
    M.paint.line(ctx, S.x, Z.ruleY, S.x + S.w * shown, Z.ruleY, C.design.hair, M.layout.RULE.hair);
    ctx.restore();
  }

  // A kicker, shifted dy inside its own line's mask.
  function drawKicker(ctx, C, sc, k, alpha, dy) {
    if (!k || alpha <= 0.001) return;
    M.debug.scene = sc.id;
    const clip = [k.x - 6, k.y - 4, C.safe.w + 12, k.h + 8];
    ctx.save();

      // the camera zooms the world, never the words.

        if (!str) return;

<script>
/*!
 * scenes/beat.js — one beat of the card layer. The card sits still over the
 * stage for the whole video: the accent bar, the kicker line and the footer

 * the same place. Only the words change from beat to beat.
 *
 *   { "id": "e2", "type": "beat",
 *     "copy": { "kicker": "1934", "title": "A closed steel body reached {F3}", "units": "Top speed",
 *               "value": "F3" },
 *     "chart": { "kind": "bars", "bars": [ { "label": "1912", "value": "F1" }, … ] },
 *     "stage": { "state": "saloon", "zoom": 1.2 } }

 * lands on the claim's display) or one flat chart (`chart`: `bars` for two to
 * six values in one unit, `line` for an ordered series from `data`), never

  const M = root.Motion;

  // The words' column: the full safe width, or the left share of a wide frame.

    const S = F.safe;

  }

  // A flat line chart in box: an ordered series, a gap where y is null,
  // forecast points dashed, the end value (a claim) beside the last point.
  function lineChart(api, box, D, endClaim, at) {
    const d = api.design, T = api.T, ctx = api.ctx, K = M.layout.K;
    if (!Array.isArray(D.x) || !Array.isArray(D.y) || D.x.length !== D.y.length || D.x.length < 3) {
      throw new Error('data "' + D.id + '": x and y must be arrays of the same length, at least 3');
    }
    const vals = D.y.filter(v => v != null);
    const min = Math.min(...vals), max = Math.max(...vals);
    const ticks = M.chart.niceTicks(min >= 0 && min < 0.4 * max ? 0 : min, max, 3);
    const lo = ticks[0], hi = ticks[ticks.length - 1];
    const tickF = T.font(d.weights.tick, d.size.tick, d.font);
    const labels = ticks.map(v => M.chart.tickLabel(v, api.spec.meta.locale, D.unit));
    const yLabW = Math.max(...labels.map(l => T.measure(ctx, l, tickF))) + 6 * K;
    const valF = T.font(d.weights.value, d.size.value, d.font);
    const endDisp = endClaim ? (endClaim.display != null ? endClaim.display : String(endClaim.value)) : null;
    const endW = endDisp ? T.measure(ctx, endDisp, valF) + 8 * K : 6 * K;
    const px = box.x + yLabW, pw = Math.max(50, box.w - yLabW - endW);
    const py = box.y + d.size.tick * 0.7, ph = Math.max(50, box.h - d.size.tick * 2.3);
    const n = D.x.length;

    const Y = v => py + ph - (v - lo) / (hi - lo || 1) * ph;
    const pts = D.y.map((v, i) => (v == null ? null : [X(i), Y(v)]));
    const ff = D.forecastFrom != null ? D.forecastFrom : null;
    const xs = [0, n - 1];
    const layers = [];
    layers.push({ kind: 'draw', id: 'axes', at, dur: 0.5, fn(cx, p) {
      cx.save(); cx.globalAlpha *= p;
      ticks.forEach((v, i) => {
        M.paint.line(cx, px, Y(v), px + pw, Y(v), d.grid, d.stroke.grid);
        M.paint.text(cx, labels[i], box.x, Y(v) - d.size.tick * 0.65, { font: tickF, color: d.tick, h: d.size.tick * 1.3, layer: 'tick-' + i, role: 'tick', size: d.size.tick });
      });
      M.paint.line(cx, px, py + ph, px + pw, py + ph, d.axis, d.stroke.axis);
      xs.forEach(i => {
        const w = T.measure(cx, String(D.x[i]), tickF), x = i === 0 ? X(0) : X(n - 1) - w;
        M.paint.text(cx, String(D.x[i]), x, py + ph + d.stroke.tickLen + 2, { w, font: tickF, color: d.tick, h: d.size.tick * 1.3, layer: 'x-' + i, role: 'tick', size: d.size.tick });

      cx.restore();
    } });
    const LINE_DUR = 1.3;
    layers.push({ kind: 'draw', id: 'line', at: at + 0.3, dur: LINE_DUR, ease: 'sineInOut', fn(cx, p) {
      const sub = (a, b) => pts.map((pt, i) => (i >= a && i <= b ? pt : null));

  M.registerScene({
    type: 'beat',
    slots: {
      kicker: { words: 4 }, title: { words: 10 }, units: { words: 8 },
      value: { claim: true }, quote: { claim: true }, name: { words: 6 }
    },
    data: 'chart?: { kind: "bars", bars: [{ label, value: claim, emph }] } | { kind: "line", series: data id, end?: claim }; stage?: the shape\'s directions for this beat',
    build(s, api) {
      const d = api.design, T = api.T, F = api.frame, S = F.safe, K = M.layout.K;
      const copy = s.copy || {};
      if (copy.value && s.chart) throw new Error('a beat carries one figure or one chart, not both');
      let title = api.copy('title');
      let units = api.copy('units');
      if (copy.quote) {
        const q = api.claim(String(copy.quote).replace(/[{}]/g, ''));
        if (!q.quote) throw new Error('copy.quote names claim ' + q.id + ', which is not marked "quote": true');
        title = '“' + (q.display != null ? q.display : q.verbatim) + '”';
        units = api.copy('name') || units;
      }
      if (!title) throw new Error('a beat needs copy.title (or copy.quote)');
      const value = copy.value ? api.claim(String(copy.value).replace(/[{}]/g, '')) : null;
      const chart = s.chart || null;
      let chartRows = null, series = null, endClaim = null;
      if (chart) {
        if (chart.kind === 'bars') {
          chartRows = M.chart.rows(api, chart.bars, 'chart.bars');
          if (chartRows.length < 2 || chartRows.length > 6) throw new Error('chart.bars takes two to six bars');
        } else if (chart.kind === 'line') {
          series = api.R.data[chart.series];
          if (!series) throw new Error('chart.series: no data table "' + chart.series + '"');
          if (chart.end) endClaim = api.claim(String(chart.end).replace(/[{}]/g, ''));
        } else throw new Error('chart.kind must be "bars" or "line"');
      }
      // The card gives the bar, the kicker and the source line; the words
      // below are laid out here at one fixed size, so every beat's headline
      // starts in the same place.
      const c = M.card(api, { kicker: api.copy('kicker'), chart: false, valign: 'top', sourceIds: api.used(), sources: series && series.source ? [series.source] : [] });
      const TY = c.TY, colW = column(F), Z = c.zone;
      const layers = c.layers.slice();
      let y = Z.top;
      const text = (id, role, str, size, lh, weight, color, at, dur) => {
        const f = T.font(weight, size, d.font);
        const placed = T.place(api.ctx, T.balance(api.ctx, str, f, colW), f, S.x, y, lh, 'left', colW);
        let wi = 0;
        const wordIndex = placed.map(l => { const st = wi; wi += l.words.length; return st; });
        layers.push({ kind: 'text', id, role, font: f, size, color, lines: placed, wordIndex, wordTotal: wi, at, dur, large: M.design.isLarge(size, weight) });
        y += placed.length * lh;
      };
      text('headline', 'headline', title, TY.headline.size, TY.headline.lh, d.weights.title, d.ink, 0.15, 0.7);
      if (units) { y += TY.headline.gap; text('units', 'units', units, TY.units.size, TY.units.lh, 400, d.muted, 0.45, 0.5); }
      const wordsBottom = y;
      let extra = 0;
      if (value) {
        // The figure under its words, as large as the column allows up to
        // twice the headline: the card's own type, scaled.
        const display = value.display != null ? value.display : String(value.value);
        const vf = T.fit(api.ctx, display, { weight: d.weights.value, family: d.font, maxW: colW, maxH: TY.headline.size * 2.4, min: TY.headline.size * 1.4, max: TY.headline.size * 2.2, lh: 1.05, maxLines: 1 });
        y += TY.units.gap;
        const h = vf.size * 1.1;
        layers.push({ kind: 'counter', id: 'value', role: 'value', display, parsed: T.parseDisplay(display),
          font: vf.font, size: vf.size, color: d.ink, x: S.x, y, h, align: 'left', boxW: colW, at: 0.35, dur: 1.1 });
        api.reserved.push({ x: S.x, y, w: colW, h });
        y += h; extra = 1;
      } else if (chartRows) {
        y += TY.units.gap;
        const tf = F.profile.type, labLh = d.size.label * tf * 1.3;
        // Compact rows: the chart shares the frame with the stage.
        const h = Math.round(chartRows.length * (labLh + 2 * K + 26 * K + 22 * K) * 0.72);
        layers.push(...M.chart.hbars(api, { x: S.x, y, w: colW, h }, chartRows, { at: 0.6, valign: 'top' }));
        y += h; extra = 1;
      } else if (series) {
        y += TY.units.gap;
        const h = Math.round(Math.min(F.H * 0.22, colW * 0.55));
        const box = { x: S.x, y, w: colW, h };
        api.reserved.push(box);
        layers.push(...lineChart(api, box, series, endClaim, 0.6));
        y += h; extra = 1;
      }
      const read = Math.max(2.0, M.readTime(T.wordCount(title)) + 0.15 * (T.wordCount(units) + T.wordCount(api.copy('kicker')))) + (chart ? 1.0 : 0);
      // What the stage needs from this beat: where the words end.
      return { layers, rule: c.rule, read, card: { wordsBottom, bottom: y, extra: !!extra, colW } };
    }
  });
})(typeof window !== 'undefined' ? window : globalThis);
