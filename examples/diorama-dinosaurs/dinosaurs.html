    const [head, b64] = u.split(',');
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: head.slice(5).split(';')[0] });
  }

  // One frame per scene hold midpoint and per transition midpoint, labelled
  // outside the frames with scene handles and timecodes.
  function contactSheet(C, o) {
    o = o || {};
    const marks = M.marks(C);
    const hd = {};
    C.scenes.forEach((s, i) => { hd[s.id] = 'V' + (i + 1); });
    const cols = Math.min(o.cols || 6, marks.length);
    const fw = C.W >= C.H ? 360 : 200, fh = Math.round(fw * C.H / C.W);
    const lab = 26, pad = 12, rows = Math.ceil(marks.length / cols);
    const sheet = document.createElement('canvas');
    sheet.width = cols * (fw + pad) + pad; sheet.height = rows * (fh + lab + pad) + pad;
    const sx = sheet.getContext('2d');
    sx.fillStyle = '#d9d9d6'; sx.fillRect(0, 0, sheet.width, sheet.height);
    const full = document.createElement('canvas');
    full.width = C.W; full.height = C.H;
    const fx = full.getContext('2d');
    marks.forEach((m, i) => {
      M.seek(fx, C, m.t, { frameT: m.t });
      const x = pad + (i % cols) * (fw + pad), y = pad + Math.floor(i / cols) * (fh + lab + pad);
      sx.drawImage(full, x, y, fw, fh);
      sx.fillStyle = '#222'; sx.font = '600 13px system-ui, sans-serif'; sx.textBaseline = 'top';
      const name = m.kind === 'scene' ? hd[m.id] + ' · ' + m.id : '↳ ' + m.id.split('→').map(id => hd[id]).join(' → ');
      sx.fillText(name + '  ' + tc(m.t, C.fps), x, y + fh + 5);
    });
    return sheet.toDataURL('image/png');
  }

  // The poster: the hook scene's hold midpoint, full size.
  function poster(C) {
    const s = C.scenes[0];
    const t = (s.enterEnd + s.exitStart) / 2;
    const c = document.createElement('canvas'); c.width = C.W; c.height = C.H;
    M.seek(c.getContext('2d'), C, t, { frameT: t });
    return c.toDataURL('image/png');
  }

  function mount(el, opts) {
    opts = opts || {};
    const spec = opts.spec || M.readSpec();
    const cutNames = Object.keys(spec.cuts || {});
    let C = null, cut = opts.cut || cutNames[0];
    let t = 0, playing = false, startWall = 0, startT = 0, raf = 0, showSafe = false, aborter = null;

    const canvas = h('canvas', { class: 'mv-canvas', 'aria-label': 'Video preview' });
    const overlay = h('canvas', { class: 'mv-overlay', 'aria-hidden': 'true' });
    const stage = h('div', { class: 'mv-stage' }, [canvas, overlay]);
    const playBtn = h('button', { type: 'button', class: 'mv-play', text: 'Play', onclick: () => toggle() });
    const scrub = h('input', { type: 'range', class: 'mv-scrub', min: '0', max: '0', step: '1', value: '0', 'aria-label': 'Frame' });
    const ticks = h('div', { class: 'mv-ticks', 'aria-hidden': 'true' });
    const time = h('span', { class: 'mv-time', text: '0:00.00' });
    const safeBtn = h('button', { type: 'button', text: 'Safe zone', 'aria-pressed': 'false', onclick: () => { showSafe = !showSafe; safeBtn.setAttribute('aria-pressed', String(showSafe)); drawOverlay(); } });
    const cutSel = cutNames.length > 1 ? h('select', { 'aria-label': 'Cut', onchange: e => { cut = e.target.value; build(); } }, cutNames.map(n => h('option', { value: n, text: n + ' · ' + spec.cuts[n].format }))) : null;
    const exportBtn = h('button', { type: 'button', class: 'mv-primary', text: 'Export video', onclick: () => doExport() });
    const cancelBtn = h('button', { type: 'button', text: 'Cancel', hidden: '', onclick: () => aborter && aborter.abort() });
    const stillsBtn = h('button', { type: 'button', text: 'Export stills', onclick: () => doStills() });
    const capBtn = h('button', { type: 'button', text: 'Copy caption', onclick: () => copy(spec.caption || '', 'Caption') });
    const altBtn = h('button', { type: 'button', text: 'Copy alt text', onclick: () => copy(spec.alt || '', 'Alt text') });
    const bar = h('progress', { class: 'mv-progress', max: '1', value: '0', hidden: '' });
    const status = h('p', { class: 'mv-status', role: 'status', 'aria-live': 'polite' });
    const controls = h('div', { class: 'mv-controls' }, [playBtn, h('div', { class: 'mv-track' }, [scrub, ticks]), time]);
    const actions = h('div', { class: 'mv-actions' }, [cutSel, safeBtn, exportBtn, cancelBtn, stillsBtn, capBtn, altBtn]);
    el.appendChild(stage); el.appendChild(controls); el.appendChild(actions); el.appendChild(bar); el.appendChild(status);
    const ctx = canvas.getContext('2d');

    function say(msg) { status.textContent = msg; }
    async function copy(text, what) {
      if (!text) { say(what + ' is empty in the spec.'); return; }
      try { await navigator.clipboard.writeText(text); say(what + ' copied.'); }
      catch (e) { say('Copy was blocked by the browser. ' + what + ': ' + text); }
    }

    function fit() {
      const maxH = opts.maxHeight || Math.max(240, window.innerHeight * 0.68);
      const maxW = el.clientWidth || C.W;
      const k = Math.min(maxW / C.W, maxH / C.H, 1);
      for (const c of [canvas, overlay]) { c.style.width = Math.round(C.W * k) + 'px'; c.style.height = Math.round(C.H * k) + 'px'; }
      stage.style.width = Math.round(C.W * k) + 'px';
    }

    function drawOverlay() {
      const o = overlay.getContext('2d');
      o.clearRect(0, 0, overlay.width, overlay.height);
      if (!showSafe) return;
      o.fillStyle = 'rgba(200,30,60,0.18)';
      const S = C.safe;
      o.fillRect(0, 0, C.W, S.y); o.fillRect(0, S.y + S.h, C.W, C.H - S.y - S.h);
      o.fillRect(0, S.y, S.x, S.h); o.fillRect(S.x + S.w, S.y, C.W - S.x - S.w, S.h);
      o.strokeStyle = 'rgba(200,30,60,0.9)'; o.lineWidth = 3; o.strokeRect(S.x, S.y, S.w, S.h);
    }

    function paint() {
      M.seek(ctx, C, t, { frameT: Math.floor(t * C.fps + 1e-6) / C.fps });
      const n = Math.min(C.frames - 1, Math.floor(t * C.fps + 1e-6));
      scrub.value = String(n);
      time.textContent = tc(t, C.fps) + ' / ' + tc(C.duration, C.fps);
    }

    function frameLoop(now) {
      t = startT + (now - startWall) / 1000;
      if (t >= C.duration) { t = C.duration - 1 / C.fps; stop(); paint(); return; }
      paint();
      raf = requestAnimationFrame(frameLoop);
    }
    function play() {
      if (t >= C.duration - 1 / C.fps) t = 0;
      playing = true; playBtn.textContent = 'Pause';
      startWall = performance.now(); startT = t;
      if (M.audio && M.audio.preview) M.audio.preview(C, t);
      raf = requestAnimationFrame(frameLoop);
    }
    function stop() {
      playing = false; playBtn.textContent = 'Play'; cancelAnimationFrame(raf);
      if (M.audio && M.audio.stopPreview) M.audio.stopPreview();
    }
    function toggle() { playing ? stop() : play(); }
    function seekFrame(n) { stop(); t = Math.max(0, Math.min(C.frames - 1, n)) / C.fps; paint(); }

    scrub.addEventListener('input', () => seekFrame(+scrub.value));
    el.addEventListener('keydown', e => {
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target !== scrub) return;
      if (e.code === 'Space') { e.preventDefault(); toggle(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); seekFrame(Math.round(t * C.fps) + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); seekFrame(Math.round(t * C.fps) - 1); }
    });
    el.tabIndex = 0;

    function build() {
      stop();
      C = M.compile(spec, cut);
      canvas.width = overlay.width = C.W; canvas.height = overlay.height = C.H;
      scrub.max = String(C.frames - 1);
      ticks.innerHTML = '';
      C.scenes.forEach((s, i) => {
        const tk = h('span', { class: 'mv-tick', title: 'V' + (i + 1) + ' · ' + s.id, text: 'V' + (i + 1) });
        tk.style.left = (s.t0 / C.duration * 100) + '%';
        ticks.appendChild(tk);
      });
      t = 0; fit(); drawOverlay(); paint();
      say(C.scenes.length + ' scenes · ' + C.format + ' · ' + C.duration.toFixed(1) + ' s at ' + C.fps + ' fps');
    }

    async function doExport() {
      stop();
      aborter = new AbortController();
      exportBtn.disabled = true; cancelBtn.hidden = false; bar.hidden = false; bar.value = 0;
      say('Exporting…');
      try {
        const r = await M.exportVideo({
          spec, cut, signal: aborter.signal,
          onProgress: p => {
            bar.value = p.frame / p.frames;
            if (p.phase === 'encode') say('Encoding frame ' + p.frame + ' of ' + p.frames + (p.eta != null ? ' · about ' + Math.ceil(p.eta) + ' s left' : ''));
            else if (p.phase === 'record') say('Recording in real time, frame ' + p.frame + ' of ' + p.frames + ' (fallback: may drop frames)');
            else say({ audio: 'Rendering the soundtrack…', mux: 'Writing the file…', probe: 'Checking the file plays back…' }[p.phase] || '…');
          }
        });
        if (r.blob) download(r.blob, slug(spec.meta.title) + '-' + cut + '.' + r.ext);
        say(r.message);
        el.dataset.lastExport = JSON.stringify({ ok: r.ok, path: r.path, frames: r.frames, duration: r.duration, roundTrip: r.roundTrip });
      } catch (e) {
        say(e.name === 'AbortError' ? 'Export cancelled.' : 'Export failed: ' + e.message);
      } finally {
        exportBtn.disabled = false; cancelBtn.hidden = true; bar.hidden = true; aborter = null;
      }
    }

    function doStills() {
      stop();
      const base = slug(spec.meta.title) + '-' + cut;
      download(dataUrlToBlob(poster(C)), base + '-poster.png');
      download(dataUrlToBlob(contactSheet(C)), base + '-contact-sheet.png');
      say('Saved the poster frame and a contact sheet (one frame per scene and per transition).');
      paint();
    }

    window.addEventListener('resize', () => C && fit());
    build();
    return { get compiled() { return C; }, seek: s => { stop(); t = s; paint(); }, play, stop, exportVideo: doExport, build };
  }

  async function start(el, opts) {
    const spec = (opts && opts.spec) || M.readSpec();
    await M.fonts.ready(spec);
    await M.loadImages(spec);
    return mount(el, Object.assign({}, opts, { spec }));
  }

  M.player = { mount, start, contactSheet, poster, tc };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* A Cretaceous coast: a fern-and-conifer plain running down to a sandy
   shore and the sea. Dinosaurs and their close cousins live in it, drawn
   to scale (lengths from the ledger), with real bodies. What happens:
   - arrive: the herd walks onto the plain; the sea reptiles swim in;
   - air: Quetzalcoatlus spreads its wings and circles over the plain;
   - birds: Archaeopteryx flaps up and modern birds fly in beside it;
   - river: Spinosaurus walks down the shore into the shallows, tail sweeping;
   - cousins: a line is drawn in the sand; the cousins move to one side;
   - speed: Gallimimus sprints laps of the plain;
   - tiny / giants: the herd files into one row along the shore, smallest
     first, then the camera pulls back from Microraptor to Argentinosaurus.
   Colours are illustration: the source gives none. */
const CAST = [
  { id: 'argentino', kind: 'sauropod', len: 'F10', home: [6, 2, 0], medium: 'land', group: 'dino', col: '#7d7466' },
  { id: 'spino', kind: 'spino', len: 'F11', home: [-18, 6, 0], medium: 'land', group: 'dino', col: '#6c7650', sail: '#a2573a' },
  { id: 'galli', kind: 'mimic', len: 'F12', home: [-30, 9, 0], medium: 'land', group: 'dino', col: '#c2a678' },
  { id: 'micro', kind: 'micro', len: 'F13', home: [-36, 11, 0], medium: 'land', group: 'dino', col: '#33333a' },
  { id: 'archae', kind: 'archae', len: 'F14', home: [-38, 7, 0], medium: 'land', group: 'dino', col: '#5c4837' },
  { id: 'quetz', kind: 'pterosaur', len: 'F15', home: [-24, -6, 0], medium: 'air', group: 'cousin', col: '#cfc9bd', wing: '#6c5a4b' },
  { id: 'plesio', kind: 'plesio', len: 'F17', home: [-14, -26, -1.2], medium: 'water', group: 'cousin', col: '#55717f' },
  { id: 'mosa', kind: 'mosa', len: 'F16', home: [14, -28, -1.2], medium: 'water', group: 'cousin', col: '#3f5a68' }
];
const WATER = -1.2, SHORE = -12;
const g = (api, v) => api.ease.glide(api.clamp(v));
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);

// A lofted body from spine knots [x, z, across, up] (fractions of L), at
// lateral offset 0; a tube limb from hip through knee to foot.
const body = (V, L, knots, t, n) => V.loft(knots.map(([x, z, a, u]) => ({ c: [x * L, 0, z * L], r: [a * L, u * L] })), t, n || 8);
const legAt = (V, L, hip, len, thick, swing, side, t) => {
  const [hx, hz] = hip, y = side * thick * 1.2 + side * 0.04 * L * 0;
  const fx = hx + Math.sin(swing) * len * 0.35, lift = Math.max(0, Math.cos(swing)) * len * 0.12;
  const knee = [hx + (fx - hx) * 0.5 + len * 0.08, y, hz - len * 0.5 + lift * 0.5];
  V.tube([hx, y, hz], knee, thick, thick * 0.8, t, 6);
  V.tube(knee, [fx, y, lift], thick * 0.8, thick * 0.6, t, 6);
};
const wing = (V, root, span, chord, side, flap, fill) => {
  const [x, y, z] = root, tip = z + Math.sin(flap) * span * 0.35;
  V.face([[x + chord * 0.4, y, z], [x - chord * 0.6, y, z], [x - chord * 0.2, y + side * span, tip], [x + chord * 0.05, y + side * span, tip]], fill);
};

const DRAW = {
  sauropod(V, L, s, m, c) {
    const t = m.tone(c.col), dark = m.tone('#5f574b'), ph = s.step, w = 0.05 * L, graze = Math.sin(s.t * 0.7) * 0.03;
    V.begin();
    legAt(V, L, [0.12 * L, 0.26 * L], 0.27 * L, 0.03 * L, ph + Math.PI, -1, dark);
    legAt(V, L, [-0.12 * L, 0.25 * L], 0.26 * L, 0.035 * L, ph, -1, dark);
    body(V, L, [[-0.5, 0.2, 0.006, 0.006], [-0.36, 0.24, 0.025, 0.028], [-0.2, 0.28, 0.06, 0.07], [0, 0.3, 0.085, 0.1], [0.14, 0.3, 0.075, 0.09],
      [0.24, 0.34, 0.04, 0.045], [0.34, 0.44 + graze, 0.028, 0.03], [0.44, 0.53 + graze * 1.5, 0.022, 0.024], [0.49, 0.54 + graze * 1.6, 0.03, 0.022], [0.53, 0.53 + graze * 1.6, 0.012, 0.01]], t, 10);
    legAt(V, L, [0.12 * L, 0.26 * L], 0.27 * L, 0.03 * L, ph, 1, t);
    legAt(V, L, [-0.12 * L, 0.25 * L], 0.26 * L, 0.035 * L, ph + Math.PI, 1, t);
    V.end();
  },
  spino(V, L, s, m, c) {
    const t = m.tone(c.col), ph = s.step, sw = Math.sin(s.t * 3) * 0.05 * s.paddle;
    V.begin();
    legAt(V, L, [-0.04 * L, 0.24 * L], 0.24 * L, 0.035 * L, ph + Math.PI, -1, m.tone('#57603f'));
    body(V, L, [[-0.52, 0.2 + sw, 0.006, 0.03], [-0.36, 0.22 + sw * 0.6, 0.02, 0.05], [-0.2, 0.24, 0.04, 0.065], [-0.02, 0.27, 0.07, 0.085], [0.14, 0.29, 0.06, 0.07],
      [0.24, 0.33, 0.035, 0.04], [0.32, 0.35, 0.03, 0.032], [0.42, 0.33, 0.018, 0.02], [0.52, 0.3, 0.008, 0.01]], t, 10);
    legAt(V, L, [0.16 * L, 0.27 * L], 0.12 * L, 0.018 * L, ph, 1, t);
    legAt(V, L, [-0.04 * L, 0.24 * L], 0.24 * L, 0.035 * L, ph, 1, t);
    V.end();
    // The sail along the back: thin, so drawn flat, after the body.
    V.extrude([[-0.18 * L, 0.33 * L], [0.12 * L, 0.35 * L], [0.04 * L, 0.56 * L], [-0.1 * L, 0.54 * L]], 'y', -0.006 * L, 0.006 * L, m.tone(c.sail));
  },
  mimic(V, L, s, m, c) {
    const t = m.tone(c.col), ph = s.step;
    V.begin();
    legAt(V, L, [-0.02 * L, 0.38 * L], 0.38 * L, 0.03 * L, ph + Math.PI, -1, m.tone('#9c845d'));
    body(V, L, [[-0.5, 0.36, 0.005, 0.006], [-0.3, 0.37, 0.02, 0.025], [-0.08, 0.38, 0.06, 0.075], [0.08, 0.42, 0.05, 0.06], [0.18, 0.52, 0.02, 0.02], [0.28, 0.63, 0.018, 0.018], [0.36, 0.65, 0.028, 0.024], [0.46, 0.63, 0.008, 0.008]], t, 8);
    legAt(V, L, [-0.02 * L, 0.38 * L], 0.38 * L, 0.03 * L, ph, 1, t);
    V.end();
  },
  archae(V, L, s, m, c) {
    const t = m.tone(c.col), z0 = s.lift / L;
    if (s.wings) wing(V, [0, -0.06 * L, s.lift + 0.38 * L], L * 0.75, L * 0.35, -1, s.flap, m.tone('#3f3227').right);
    V.begin();
    if (s.lift < 0.01) legAt(V, L, [0, 0.33 * L], 0.33 * L, 0.025 * L, s.step, 1, t);
    body(V, L, [[-0.5, 0.36 + z0, 0.01, 0.01], [-0.25, 0.37 + z0, 0.03, 0.025], [-0.05, 0.38 + z0, 0.07, 0.08], [0.12, 0.42 + z0, 0.05, 0.05], [0.24, 0.5 + z0, 0.03, 0.03], [0.34, 0.52 + z0, 0.035, 0.03], [0.44, 0.5 + z0, 0.01, 0.01]], t, 8);
    V.end();
    if (s.wings) wing(V, [0, 0.06 * L, s.lift + 0.38 * L], L * 0.75, L * 0.35, 1, s.flap, m.tone('#3f3227').top);
  },
  micro(V, L, s, m, c) {
    const t = m.tone(c.col), fl = s.flap, wt = m.tone('#24242a');
    wing(V, [0.05 * L, -0.05 * L, 0.36 * L], L * 0.55, L * 0.25, -1, fl, wt.right);
    wing(V, [-0.15 * L, -0.05 * L, 0.3 * L], L * 0.35, L * 0.2, -1, fl * 0.7, wt.right);
    V.begin();
    legAt(V, L, [0, 0.31 * L], 0.31 * L, 0.025 * L, s.step, 1, t);
    body(V, L, [[-0.5, 0.32, 0.01, 0.01], [-0.25, 0.33, 0.025, 0.022], [-0.05, 0.35, 0.065, 0.07], [0.12, 0.4, 0.045, 0.045], [0.24, 0.47, 0.028, 0.028], [0.34, 0.48, 0.032, 0.028], [0.44, 0.46, 0.01, 0.01]], t, 8);
    V.end();
    wing(V, [0.05 * L, 0.05 * L, 0.36 * L], L * 0.55, L * 0.25, 1, fl, wt.top);
    wing(V, [-0.15 * L, 0.05 * L, 0.3 * L], L * 0.35, L * 0.2, 1, fl * 0.7, wt.top);
  },
  pterosaur(V, span, s, m, c) {
    const L = span * 0.33, t = m.tone(c.col), wt = m.tone(c.wing), z0 = s.lift / L, open = s.open;
    const sp = L * 0.25 + (span / 2 - L * 0.25) * open;
    wing(V, [0, -0.04 * L, s.lift + 0.36 * L], sp, L * 0.5, -1, s.flap * open, wt.right);
    V.begin();
    body(V, L, [[-0.4, 0.32 + z0, 0.01, 0.01], [-0.2, 0.33 + z0, 0.05, 0.05], [0, 0.35 + z0, 0.07, 0.07], [0.14, 0.42 + z0, 0.03, 0.03], [0.28, 0.56 + z0, 0.02, 0.02], [0.38, 0.63 + z0, 0.05, 0.05], [0.56, 0.6 + z0, 0.01, 0.012]], t, 8);
    if (s.lift < 0.01) { legAt(V, L, [-0.1 * L, 0.33 * L], 0.33 * L, 0.03 * L, s.step, 1, t); legAt(V, L, [0.12 * L, 0.36 * L], 0.36 * L, 0.03 * L, s.step + Math.PI, 1, t); }
    V.end();
    wing(V, [0, 0.04 * L, s.lift + 0.36 * L], sp, L * 0.5, 1, s.flap * open, wt.top);
  },
  plesio(V, L, s, m, c) {
    const t = m.tone(c.col), f = Math.sin(s.t * 2.2), fl = m.tone('#40596a');
    [[0.12, -1], [-0.2, -1]].forEach(([x, sd]) => wing(V, [x * L, sd * 0.08 * L, 0.02 * L], L * 0.26, L * 0.12, sd, f * 0.6, fl.right));
    V.begin();
    body(V, L, [[-0.5, 0.02, 0.01, 0.008], [-0.3, 0.03, 0.08, 0.05], [-0.05, 0.04, 0.12, 0.07], [0.15, 0.05, 0.07, 0.05], [0.3, 0.13, 0.03, 0.03], [0.44, 0.22, 0.025, 0.025], [0.5, 0.22, 0.03, 0.022], [0.55, 0.21, 0.01, 0.01]], t, 8);
    V.end();
    [[0.12, 1], [-0.2, 1]].forEach(([x, sd]) => wing(V, [x * L, sd * 0.08 * L, 0.02 * L], L * 0.26, L * 0.12, sd, -f * 0.6, fl.top));
  },
  mosa(V, L, s, m, c) {
    const t = m.tone(c.col), sw = Math.sin(s.t * 1.6) * 0.03;
    V.extrude([[-0.5 * L, 0.02 * L], [-0.44 * L, 0.03 * L], [-0.52 * L, 0.14 * L], [-0.58 * L, 0.1 * L]], 'y', -0.006 * L, 0.006 * L, m.tone('#334a56'));
    V.begin();
    body(V, L, [[-0.5, 0.03 + sw, 0.015, 0.03], [-0.3, 0.04, 0.04, 0.05], [-0.05, 0.05, 0.07, 0.07], [0.2, 0.05, 0.06, 0.06], [0.38, 0.05, 0.04, 0.04], [0.5, 0.04, 0.012, 0.014]], t, 8);
    V.end();
  }
};

Motion.things.coast = {
  place(w, api) {
    const P = {}, L = {};
    CAST.forEach(c => { L[c.id] = w.value(c.len); P[c.id] = c.home.slice(); });
    const arrive = g(api, w.progress('hook'));
    CAST.forEach(c => { P[c.id] = mix([c.home[0] - 70, c.home[1], c.home[2]], c.home, arrive); });
    const wade = g(api, w.progress('river'));
    P.spino = mix(P.spino, [-12, -18, WATER * 0.6], wade);
    const split = g(api, w.progress('cousins'));
    CAST.forEach(c => { P[c.id] = mix(P[c.id], [c.group === 'cousin' ? P[c.id][0] - 22 : P[c.id][0] + 10, P[c.id][1], P[c.id][2]], split); });
    const sorted = CAST.slice().sort((a, b) => L[a.id] - L[b.id]);
    let cursor = -44;
    const lineAt = {};
    sorted.forEach(c => { const len = L[c.id]; lineAt[c.id] = [cursor + len / 2, c.medium === 'water' ? -18 : -8, c.medium === 'water' ? WATER : 0]; cursor += len + 1.2; });
    const line = g(api, w.progress('tiny'));
    CAST.forEach(c => { P[c.id] = mix(P[c.id], lineAt[c.id], line); });
    return { P, L, lineAt, line, split };
  },
  flight(w, api, P, split, line) {
    const a = w.t * 0.45, fly = g(api, w.progress('air')) * (1 - line);
    return { fly, x: api.lerp(P.quetz[0], -14 + Math.cos(a) * 12 + split * -22, fly), y: api.lerp(P.quetz[1], -6 + Math.sin(a) * 7, fly) };
  },
  lap(w, api, P) {
    const run = w.has('speed') ? api.clamp(w.progress('speed') * 3) * (1 - g(api, w.progress('tiny'))) : 0;
    const a = (w.progress('speed') * 2 + w.since('speed') * 0.9) * Math.PI * 2;
    return { run, a, x: api.lerp(P.galli[0], -40 + Math.cos(a) * 12, run), y: api.lerp(P.galli[1], 6 + Math.sin(a) * 5, run) };
  },
  marks(w) {
    const api = { ease: Motion.ease, clamp: v => Math.max(0, Math.min(1, v)), lerp: (a, b, k) => a + (b - a) * k };
    const { P, lineAt, split, line } = this.place(w, api);
    const fl = this.flight(w, api, P, split, line), lp = this.lap(w, api, P);
    const r = g(api, w.progress('giants'));
    const xs = Object.values(lineAt).map(p => p[0]), lineMid = (Math.min(...xs) + Math.max(...xs)) / 2;
    return {
      herd: [-12, -2, 4], board: [-6, -6, 4], line: [lineMid + 6, -11, 7],
      archae: [P.archae[0] + 1.5, P.archae[1], 0.4 + g(api, w.progress('birds')) * (1 - line) * 3], spino: [P.spino[0], P.spino[1], 4],
      micro: [P.micro[0] + 0.3, P.micro[1], 0.4],
      quetz: [fl.x, fl.y, 4 + fl.fly * 9], galli: [lp.x, lp.y, 1.5],
      reveal: [api.lerp(P.micro[0] + 0.3, lineMid + 6, r), api.lerp(P.micro[1], -11, r), api.lerp(0.4, 7, r), api.lerp(14, 1, r)]
    };
  },
  ground(w, api) {
    const m = api.mat, G = api.view('ground'), lo = api.range[0] - 40, hi = api.range[1] + 40;
    // The sea behind, the sand, the plain in front.
    G.block(lo, -120, -4, hi - lo, 108 + SHORE + 12, 2.8, m.nature.water, { r: 0, b: 0 });
    G.block(lo, SHORE - 4, -4, hi - lo, 5, 4, m.nature.sand, { r: 0, b: 0.8 });
    G.block(lo, SHORE, -4, hi - lo, 120, 4, m.tone('#87995a'), { r: 0, b: 0 });
    // Patches of darker grass, scattered, so the plain isn't a flat sheet.
    for (let k = 0; k < 40; k++) {
      const R = api.rng('patch', k), x = -90 + R() * 200, y = SHORE + 3 + R() * 50, s = 2 + R() * 6;
      if (x < lo || x > hi) continue;
      G.face([[x, y, 0.01], [x + s, y, 0.01], [x + s, y + s * 0.6, 0.01], [x, y + s * 0.6, 0.01]], m.tone('#77894d').top);
    }
  },
  trees(w, api, front) {
    // Conifer stands at the edges of the plain, ferns scattered low.
    const m = api.mat, T = api.view('trees'), foliage = m.tone('#4c6b3e'), dark = m.tone('#3d5733'), bark = m.nature.bark;
    const stands = [[-78, -4], [-70, 6], [-84, 12], [-64, -8], [70, 0], [80, 10], [64, -6], [88, -2], [-58, 26], [52, 30]];
    stands.forEach(([x0, y0], k) => {
      if ((x0 + y0 > 0) !== front) return;
      const R = api.rng('stand', k);
      for (let j = 0; j < 4; j++) {
        const x = x0 + (R() - 0.5) * 10, y = y0 + (R() - 0.5) * 10, h = 10 + R() * 9;
        T.tube([x, y, 0], [x, y, h * 0.35], 0.5, 0.4, bark, 5);
        T.cone(x, y, h * 0.25, 2.6 + R(), h * 0.55, j % 2 ? foliage : dark, 7);
        T.cone(x, y, h * 0.55, 1.8 + R() * 0.6, h * 0.45, foliage, 7);
      }
    });
    if (front) for (let k = 0; k < 30; k++) {
      const R = api.rng('fern', k), x = -60 + R() * 130, y = SHORE + 20 + R() * 20;
      T.cone(x, y, 0, 0.8 + R() * 0.8, 0.9 + R(), m.tone('#5d7d47'), 5);
    }
  },
  draw(w, api) {
    const m = api.mat, t = w.t;
    const { P, L, split, line } = this.place(w, api);
    this.ground(w, api);
    this.trees(w, api, false);
    const G = api.view('ground');
    // The line drawn in the sand between dinosaurs and cousins.
    const dl = split * (1 - api.clamp(line * 4));
    if (dl > 0.01) {
      G.ctx.save(); G.ctx.globalAlpha *= dl;
      G.face([[-25, -40, 0.03], [-24.4, -40, 0.03], [-24.4, 16, 0.03], [-25, 16, 0.03]], m.tone('#5b4a36').top);
      G.ctx.restore();
      api.label('Close cousins', -46, 16, 0, { dy: 8, alpha: dl, color: '#161d0f', on: '#87995a' });
      api.label('Dinosaurs', -10, 16, 0, { dy: 8, alpha: dl, color: '#161d0f', on: '#87995a' });
    }
    // The measuring strip in the sand under the row, ticks every five metres.
    if (line > 0.01) {
      G.ctx.save(); G.ctx.globalAlpha *= line;
      G.face([[-46, -3.2, 0.02], [46, -3.2, 0.02], [46, -2.8, 0.02], [-46, -2.8, 0.02]], m.tone('#4a3c2c').top);
      for (let x = -45; x <= 45; x += 5) G.face([[x - 0.15, -3.2, 0.03], [x + 0.15, -3.2, 0.03], [x + 0.15, -1.6, 0.03], [x - 0.15, -1.6, 0.03]], m.tone('#4a3c2c').top);
      G.ctx.restore();
    }
    const air = g(api, w.progress('air')), up = g(api, w.progress('birds'));
    const sprint = w.has('speed') ? api.clamp(w.progress('speed') * 3) * (1 - g(api, w.progress('tiny'))) : 0;
    const things = [];
    CAST.forEach(c => {
      let [x, y, z] = P[c.id];
      const s = { t, step: (x * 0.9 + y * 0.4) / Math.max(0.3, L[c.id] * 0.12), flap: 0, lift: 0, wings: 0, open: 0, paddle: 0 };
      if (c.id === 'quetz') {
        const fl = this.flight(w, api, P, split, line), fly = fl.fly;
        x = fl.x; y = fl.y; s.lift = fly * 13; s.open = Math.max(fly, 0.15); s.flap = Math.sin(t * 2.4) * fly;
        if (line > 0) { s.open = api.lerp(s.open, 1, line); s.lift = api.lerp(s.lift, 6, line); s.flap = Math.sin(t * 2.4) * 0.6 * line + s.flap * (1 - line); }
      }
      if (c.id === 'archae') { s.wings = 1; s.lift = up * (1 - line) * (3 + Math.sin(t * 2) * 0.5); s.flap = Math.sin(t * 9) * (up > 0 ? 1 : 0.15); }
      if (c.id === 'micro') s.flap = Math.sin(t * 8) * (0.2 + 0.8 * g(api, w.progress('tiny')));
      if (c.id === 'spino') s.paddle = g(api, w.progress('river'));
      if (c.id === 'galli' && sprint > 0) { const lp = this.lap(w, api, P); x = lp.x; y = lp.y; s.step = lp.a * 9; }
      things.push({ c, x, y, z, s });
    });
    if (w.has('birds') && w.progress('birds') > 0) {
      const k = w.progress('birds') + w.since('birds') * 0.15, ax = P.archae[0], ay = P.archae[1];
      for (let i = 0; i < 5; i++) {
        const bx = ax - 12 + k * 14 + (i % 3) * 1.4, by = ay - 1.5 + i * 0.9, bz = 2.5 + (i % 2) * 0.8 + Math.sin(t * 2 + i) * 0.2;
        things.push({ bird: true, x: bx, y: by, z: bz, s: { t, flap: Math.sin(t * 11 + i), lift: 0, wings: 1, step: 0 }, fade: api.clamp(1 - (k - 1.2) * 2) });
      }
    }
    things.sort((a, b) => (a.x + a.y) - (b.x + b.y));
    things.forEach(o => {
      const V = api.view(o.bird ? 'birds' : o.c.id, [o.x, o.y, o.z]);
      if (o.bird) { V.ctx.save(); V.ctx.globalAlpha *= o.fade; DRAW.archae(V, 0.35, o.s, m, { col: '#45454a' }); V.ctx.restore(); return; }
      const Ln = L[o.c.id];
      if (o.c.medium !== 'water') V.shade(0, 0, Ln * 0.42, Ln * 0.09, '#1d2416', o.z > 0.5 || o.s.lift > 0.5 ? 0.08 : 0.2);
      DRAW[o.c.kind](V, Ln, o.s, m, o.c);
    });
    this.trees(w, api, true);
    if (line > 0.9) {
      const rv = g(api, w.progress('giants'));
      if (rv > 0.6) api.label('Argentinosaurus', P.argentino[0] - 6, -3, 0, { dy: 14, alpha: (rv - 0.6) * 2.5, color: '#161d0f', on: '#87995a' });
      if (w.progress('tiny') > 0) {
        api.avoid(api.rect(P.micro[0] - 0.5, P.micro[1] - 0.6, 0, 1, 1.2, 0.6));
        api.label('Microraptor', P.micro[0] - 0.2, P.micro[1] + 1.6, 0, { dy: 12, alpha: g(api, w.progress('tiny')), color: '#161d0f', on: '#87995a' });
      }
    }
  }
};

(async function () {
  const el = document.getElementById('player');
  try {
    const spec = Motion.readSpec();
    // The chrome follows the video's preset (and brand palette, if any).
    Motion.design.resolve(spec.meta);
    const t = Charts.theme, s = document.documentElement.style;
    s.setProperty('--card', t.bg); s.setProperty('--ground', t.tileSurface); s.setProperty('--ink', t.titleColor);
    s.setProperty('--muted', t.secondaryColor); s.setProperty('--hair', t.grid); s.setProperty('--accent', t.colors[1]);
    document.getElementById('caption-out').textContent = spec.caption ? 'Caption: ' + spec.caption : '';
    document.getElementById('alt-out').textContent = spec.alt ? 'Alt text: ' + spec.alt : '';
    window.videoPlayer = await Motion.player.start(el, { spec });
  } catch (e) {
    el.textContent = 'The video spec has a problem: ' + e.message;
    console.error(e);
  }
})();
