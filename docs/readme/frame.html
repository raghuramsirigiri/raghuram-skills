<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame</title>
<!-- Renders one capture inside a browser window on a tinted ground.
     build.mjs opens it as frame.html?img=…&title=…&w=…&h=… at 1600x1080. -->
<style>
  :root {
    --ground-a:#eceaf6; --ground-b:#f4f1ea; --ground-c:#e6ecf4;
    --chrome:#f7f6f3; --chrome-line:#e4e2dc; --title:#6f6d68;
    --win-w:1360px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; width:1600px; height:1080px; overflow:hidden; }
  body {
    display:grid; place-items:center;
    background:
      radial-gradient(1100px 700px at 12% 8%, rgba(35,35,255,0.10), transparent 60%),
      radial-gradient(900px 700px at 92% 96%, rgba(35,35,255,0.07), transparent 60%),
      linear-gradient(135deg, var(--ground-a) 0%, var(--ground-b) 52%, var(--ground-c) 100%);
    font-family:'Inter','Segoe UI',system-ui,sans-serif;
  }
  .win {
    width:var(--win-w); border-radius:14px; overflow:hidden; background:var(--chrome);
    box-shadow:
      0 0 0 1px rgba(20,20,40,0.06),
      0 2px 4px rgba(20,20,40,0.04),
      0 18px 40px -8px rgba(30,30,70,0.18),
      0 50px 90px -30px rgba(30,30,90,0.30);
  }
  .bar { height:42px; display:grid; grid-template-columns:120px 1fr 120px; align-items:center;
    border-bottom:1px solid var(--chrome-line); padding:0 18px; }
  .dots { display:flex; gap:8px; }
  .dots i { width:12px; height:12px; border-radius:50%; display:block; }
  .dots i:nth-child(1) { background:#ff5f57; box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.12); }
  .dots i:nth-child(2) { background:#febc2e; box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.12); }
  .dots i:nth-child(3) { background:#28c840; box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.12); }
  .title { text-align:center; font-size:13px; color:var(--title); letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .view { position:relative; }
  .shot { display:block; width:100%; height:auto; }
  /* For a page that runs on past the window (the one-pager), fade the last
     stretch into the ground instead of cutting a line of text in half. */
  .view.fade::after { content:''; position:absolute; left:0; right:0; bottom:0; height:150px;
    background:linear-gradient(to bottom, rgba(232,229,223,0), rgba(232,229,223,0.85) 55%, #e8e5df); }
</style>
</head>
<body>
  <div class="win">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="title" id="t"></div><div></div></div>
    <div class="view" id="view"><img class="shot" id="img" alt=""></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('t').textContent = q.get('title') || '';
  document.getElementById('img').src = q.get('img');
  if (q.get('fade')) document.getElementById('view').classList.add('fade');
</script>
</body>
</html>
