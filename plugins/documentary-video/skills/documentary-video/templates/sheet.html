<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast sheet</title>
<style>
  html, body { margin: 0; background: #f4f4f0; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="sheet"></canvas>
<!-- theme.js before everything: the film's colours are the theme's tokens -->
<script src="film-lib/theme.js"></script>
<script src="film-lib/geom.js"></script>
<script src="film-lib/scene.js"></script>
<script src="film-lib/render.js"></script>
<script src="film-lib/rig.js"></script>
<script src="film-lib/sheet.js"></script>
<!-- the film's cast, film/cast.js: sets window.CAST = [{ name, note, make(state), states }].
     Loaded with a fresh query each time, so an edit always shows on reload. -->
<script>
  const cast = document.createElement('script');
  // ?cast=samples/tiers.js opens another cast file (the tier samples)
  const q0 = new URLSearchParams(location.search);
  cast.src = (q0.get('cast') || 'film/cast.js') + '?t=' + Date.now();
  cast.onload = draw;
  cast.onerror = () => { document.title = 'Cast sheet: film/cast.js failed to load'; };
  document.body.appendChild(cast);
  function draw() {
  // ?only=<part of a name> shows just those items; ?cols=1 shows them big
  const q = new URLSearchParams(location.search);
  const res = Film.sheet(document.getElementById('sheet'), window.CAST || [], {
    title: window.CAST_TITLE || 'Cast', only: q.get('only') || '', cols: +q.get('cols') || 0 });
  document.title = 'Cast sheet: ' + res.cells + ' views, ' + res.errors.length + ' errors';
  }
</script>
</body>
</html>
