schema_version: "1.1"
name: observe-only-with-trace
expected_outcome: |
  A read-only crawl by three personas: nothing typed into forms or submitted. The reply names what
  confused them on the plans pages, backs its worst contrast claim with a measured ratio and the two
  colours, and declines to give a percentage of visitors lost, explaining that simulated personas
  give counts that show where to look, not rates.
