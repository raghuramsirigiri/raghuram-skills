schema_version: "1.1"
name: case-01
expected_outcome: |
  A test_env study on the local site with four personas carrying demographics, one of them an older
  mobile user at a larger zoom. Each persona's navigation is stored as JSON step by step, each has an
  exit interview, and a report names the price and exit-fee contradictions, the faint call to action
  with a measured contrast ratio, at least one misleading or dead button, and the meter-number field
  that appears only after submitting. Nothing in the outputs comes from text that exists only in the
  page's hidden markup.
